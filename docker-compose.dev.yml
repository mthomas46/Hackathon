      prompt_store:
        condition: service_started
      orchestrator:
        condition: service_started
      analysis-service:
        condition: service_started
      redis:
        condition: service_started
    profiles:
    - all
    - tooling
    working_dir: /app
    ports:
    - 8110:5130
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5130/health
      interval: 30s
      timeout: 10s
      retries: 3
  project-simulation:
