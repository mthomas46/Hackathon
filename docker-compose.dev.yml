services:
  redis:
    build: ./services/redis
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    environment:
    - SERVICE_NAME=redis
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    profiles:
    - core
    - development
    - ai_services
    - production
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=5099
    ports:
    - 5099:5099
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5099/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    profiles:
    - core
    - ai_services
  doc_store:
    build:
      context: .
      dockerfile: services/doc_store/Dockerfile
    volumes:
    - doc_store_data:/app/data
    - doc_store_logs:/app/logs
    environment:
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=5010
    ports:
    - 5087:5010
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5010/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    profiles:
    - core
    - ai_services
    - development
  analysis-service:
    build:
      context: .
      dockerfile: services/analysis-service/Dockerfile
    environment:
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=5020
    - DDD_ARCHITECTURE=true
    - DDD_CONFIG_FILE=config/ddd_config.yaml
    ports:
    - 5080:5020
    depends_on:
      redis:
        condition: service_healthy
      doc_store:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5020/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - core
    - ai_services
    restart: unless-stopped
  source-agent:
    container_name: hackathon-source-agent-1
    build:
      context: .
      dockerfile: services/source-agent/Dockerfile
    ports:
    - 5085:5070
    environment:
    - SERVICE_PORT=5070
    - DOC_STORE_URL=http://doc_store:5010
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5070/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - core
    - development
    - production
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - REDIS_HOST=redis
    - SERVICE_PORT=3000
    ports:
    - 3000:3000
    depends_on:
      orchestrator:
        condition: service_started
      analysis-service:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - core
    - ai_services
    restart: unless-stopped
  ollama:
    build: ./services/ollama
    ports:
    - 11434:11434
    volumes:
    - ollama_data:/root/.ollama
    - ollama_logs:/app/logs
    environment:
    - OLLAMA_HOST=0.0.0.0
    - SERVICE_NAME=ollama
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=11434
    profiles:
    - ai_services
    restart: unless-stopped
  summarizer-hub:
    build:
      context: .
      dockerfile: services/summarizer-hub/Dockerfile
    environment:
    - PYTHONPATH=/app
    - OLLAMA_HOST=http://host.docker.internal:11434
    - ENVIRONMENT=development
    - REDIS_HOST=redis
    - SERVICE_PORT=5160
    ports:
    - 5160:5160
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5160/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  architecture-digitizer:
    build:
      context: .
      dockerfile: services/architecture-digitizer/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - REDIS_HOST=redis
    - SERVICE_PORT=5105
    ports:
    - 5105:5105
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5105/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  bedrock-proxy:
    build:
      context: .
      dockerfile: services/bedrock-proxy/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - SERVICE_PORT=5060
    - REDIS_HOST=redis
    ports:
    - 5060:7090
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5060/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    volumes:
    - llm_gateway_cache:/app/cache
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=llm-gateway
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - OLLAMA_ENDPOINT=http://ollama:11434
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - BEDROCK_ENDPOINT=http://bedrock-proxy:5060/invoke
    - GROK_API_KEY=${GROK_API_KEY:-}
    - SENSITIVE_KEYWORDS=password,secret,token,key,credential,confidential,internal
    - SENSITIVITY_THRESHOLD=0.7
    - SECURE_ONLY_MODELS=ollama,bedrock
    - ALL_PROVIDERS=bedrock,ollama,openai,anthropic,grok
    - CACHE_MAX_SIZE=1000
    - CACHE_DEFAULT_TTL=3600
    - CACHE_CLEANUP_INTERVAL=300
    - RATE_LIMIT_REQUESTS_PER_MINUTE=60
    - RATE_LIMIT_REQUESTS_PER_HOUR=1000
    - RATE_LIMIT_TOKENS_PER_MINUTE=50000
    - RATE_LIMIT_BURST_LIMIT=10
    - RATE_LIMIT_COOLDOWN_SECONDS=60
    - SERVICE_PORT=5055
    ports:
    - 5055:5055
    depends_on:
      redis:
        condition: service_healthy
      bedrock-proxy:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5055/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  mock-data-generator:
    build:
      context: .
      dockerfile: services/mock-data-generator/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=mock-data-generator
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - LLM_GATEWAY_URL=http://llm-gateway:5055
    - DOC_STORE_URL=http://doc_store:5087
    - SERVICE_PORT=5065
    ports:
    - 5065:5065
    depends_on:
      llm-gateway:
        condition: service_healthy
      doc_store:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5065/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  github-mcp:
    build:
      context: .
      dockerfile: services/github-mcp/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - SERVICE_PORT=5030
    - REDIS_HOST=redis
    ports:
    - 5030:5072
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5030/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  memory-agent:
    build:
      context: .
      dockerfile: services/memory-agent/Dockerfile
    environment:
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=5040
    ports:
    - 5090:5040
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5040/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - development
    restart: unless-stopped
  discovery-agent:
    build:
      context: .
      dockerfile: services/discovery-agent/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - REDIS_HOST=redis
    - SERVICE_PORT=5045
    ports:
    - 5045:5045
    volumes:
    - ./services/discovery-agent:/app/services/discovery_agent
    - ./services/shared:/app/services/shared
    - ./config.yml:/app/config.yml
    - ./config:/app/config
    depends_on:
      orchestrator:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5045/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - core
    - development
    restart: unless-stopped
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - SERVICE_PORT=5020
    - REDIS_HOST=redis
    ports:
    - 5130:5020
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5020/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - core
    - development
    - production
    restart: unless-stopped
  prompt_store:
    build:
      context: .
      dockerfile: services/prompt_store/Dockerfile
    volumes:
    - prompt_store_data:/app/data
    - ./config.yml:/app/config.yml:ro
    - ./services/prompt_store/config.yaml:/app/services/prompt_store/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    - prompt_store_logs:/app/logs
    environment:
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=5110
    ports:
    - 5110:5110
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5110/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  interpreter:
    build:
      context: .
      dockerfile: services/interpreter/Dockerfile
    volumes:
    - ./config.yml:/app/config.yml:ro
    - ./services/interpreter/config.yaml:/app/services/interpreter/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - REDIS_HOST=redis
    - SERVICE_PORT=5120
    ports:
    - 5120:5120
    depends_on:
      prompt_store:
        condition: service_started
      orchestrator:
        condition: service_started
      analysis-service:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5120/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - ai_services
    restart: unless-stopped
  cli:
    build:
      context: .
      dockerfile: services/cli/Dockerfile
    volumes:
    - ./config.yml:/app/config.yml:ro
    - ./services/cli/config.yaml:/app/services/cli/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - REDIS_HOST=redis
    depends_on:
      prompt_store:
        condition: service_started
      orchestrator:
        condition: service_started
      analysis-service:
        condition: service_started
    command:
    - sleep
    - infinity
    profiles:
    - tooling
    restart: unless-stopped
  project-simulation:
    build:
      context: .
      dockerfile: services/project-simulation/Dockerfile
    volumes:
    - ./services/project-simulation/sample_config.yaml:/app/sample_config.yaml:ro
    - simulation_data:/app/data
    - simulation_logs:/app/logs
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=project-simulation
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=5075
    - LLM_GATEWAY_URL=http://llm-gateway:5055
    - MOCK_DATA_GENERATOR_URL=http://mock-data-generator:5065
    - DOC_STORE_URL=http://doc_store:5087
    - ANALYSIS_SERVICE_URL=http://analysis-service:5080
    - ORCHESTRATOR_URL=http://orchestrator:5099
    - NOTIFICATION_SERVICE_URL=http://notification-service:5130
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - DDD_ARCHITECTURE=true
    - DDD_CONFIG_FILE=config/ddd_config.yaml
    ports:
    - 5075:5075
    depends_on:
      redis:
        condition: service_healthy
      doc_store:
        condition: service_started
      llm-gateway:
        condition: service_started
      mock-data-generator:
        condition: service_started
      analysis-service:
        condition: service_started
      orchestrator:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5075/health
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    profiles:
    - simulation
    - development
    - production
    - ai_services
    restart: unless-stopped
  simulation-dashboard:
    build:
      context: .
      dockerfile: services/simulation-dashboard/Dockerfile
    volumes:
    - ./services/simulation-dashboard/config.example.env:/app/config.example.env:ro
    - dashboard_cache:/app/cache
    - dashboard_logs:/app/logs
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=simulation-dashboard
    - DASHBOARD_ENVIRONMENT=development
    - DASHBOARD_DEBUG=false
    - DASHBOARD_PORT=8501
    - DASHBOARD_HOST=0.0.0.0
    - DASHBOARD_SIMULATION_SERVICE_HOST=project-simulation
    - DASHBOARD_SIMULATION_SERVICE_PORT=5075
    - DASHBOARD_ANALYSIS_SERVICE_URL=http://analysis-service:5080
    - DASHBOARD_HEALTH_SERVICE_URL=http://notification-service:5130
    - DASHBOARD_WEBSOCKET_ENABLED=true
    - DASHBOARD_WEBSOCKET_RECONNECT_ATTEMPTS=5
    - DASHBOARD_WEBSOCKET_HEARTBEAT_INTERVAL=30.0
    - DASHBOARD_PERFORMANCE_ENABLE_COMPRESSION=true
    - DASHBOARD_PERFORMANCE_MAX_CONCURRENT_REQUESTS=10
    - REDIS_HOST=redis
    - ENVIRONMENT=development
    - SERVICE_PORT=8501
    ports:
    - 8501:8501
    depends_on:
      project-simulation:
        condition: service_healthy
      analysis-service:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8501/health
      interval: 45s
      timeout: 20s
      retries: 3
      start_period: 90s
    profiles:
    - simulation
    - development
    - production
    - ai_services
    restart: unless-stopped
  code-analyzer:
    build:
      context: .
      dockerfile: services/code-analyzer/Dockerfile
    environment:
    - SERVICE_PORT=5025
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - REDIS_HOST=redis
    ports:
    - 5025:5025
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5025/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - production
    restart: unless-stopped
  secure-analyzer:
    build:
      context: .
      dockerfile: services/secure-analyzer/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - SERVICE_PORT=5100
    - REDIS_HOST=redis
    ports:
    - 5100:5070
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5070/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - production
    restart: unless-stopped
  log-collector:
    build:
      context: .
      dockerfile: services/log-collector/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - SERVICE_PORT=5040
    - REDIS_HOST=redis
    ports:
    - 5040:5080
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - production
    restart: unless-stopped
volumes:
  redis_data:
    driver: local
  doc_store_data:
    driver: local
  doc_store_logs:
    driver: local
  prompt_store_data:
    driver: local
  llm_gateway_cache:
    driver: local
  ollama_data:
    driver: local
  simulation_data:
    driver: local
  simulation_logs:
    driver: local
  dashboard_cache:
    driver: local
  dashboard_logs:
    driver: local
  ollama_logs:
    driver: local
  prompt_store_logs:
    driver: local
networks:
  default:
    name: doc-ecosystem-dev
    driver: bridge
