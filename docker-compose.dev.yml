    - SERVICE_API_PORT=8000
    - ENVIRONMENT=development
    - LOG_LEVEL=INFO
    - METRICS_ENABLED=true
    - REDIS_API_HOST=redis
    - REDIS_API_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    - DISCOVERY_AGENT_URL=http://discovery-agent:5045
    - DOC_STORE_URL=http://doc_store:5087
    - ANALYSIS_SERVICE_URL=http://analysis-service:5080
    - CODE_ANALYZER_URL=http://code-analyzer:5025
    - SECURE_ANALYZER_URL=http://secure-analyzer:5100
    - SUMMARIZER_HUB_URL=http://summarizer-hub:5160
    - LLM_GATEWAY_URL=http://llm-gateway:5055
    - CACHE_ENABLED=true
    - CACHE_TTL=3600
    - RATE_LIMIT_REQUESTS_PER_MINUTE=1000
    - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
    - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-dev-audit-secret-key-change-in-production}
    - CORS_ORIGINS=http://localhost:3000,http://localhost:8501,http://localhost:8000
    ports:
    - 8101:8000
    volumes:
    - ./services/unified-api-dashboard:/app/services/unified-api-dashboard:rw
    - ./services/shared:/app/services/shared:rw
    depends_on:
