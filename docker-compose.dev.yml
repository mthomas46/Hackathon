    profiles:
    - all
    - development
    working_dir: /app
    depends_on:
    - redis
  external-service-store:
    build:
      context: .
      dockerfile: services/external-service-store/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=external-service-store
    - SERVICE_API_PORT=5140
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    ports:
    - 8105:5140
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5140/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - core
    - utility
    working_dir: /app
    volumes:
    - ./services/external-service-store:/app/services/external-service-store:rw
  user-store:
    build:
