services:
  redis:
    build: ./services/redis
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    environment:
      SERVICE_NAME: redis
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    networks:
    - hackathon_default
  log-collector:
    build:
      context: .
      dockerfile: services/log-collector/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=log-collector
    - SERVICE_API_PORT=5080
    - ENVIRONMENT=development
    - LOG_COLLECTOR_ENABLED=false
    - SERVICE_HEALTH_CHECK_INTERVAL=30
    - ENABLE_HEALTH_SAFEGUARDS=false
    ports:
    - 8104:5080
    profiles:
    - all
    - development
    working_dir: /app
    depends_on:
    - redis
    networks:
    - hackathon_default
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=orchestrator
    - SERVICE_API_PORT=5099
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    ports:
    - 8085:5099
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5099/health
      interval: 30s
      timeout: 10s
      retries: 3
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/orchestrator:/app/services/orchestrator:rw
    networks:
    - hackathon_default
    profiles:
    - all
  analysis-service:
    build:
      context: .
      dockerfile: services/analysis-service/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=analysis-service
    - SERVICE_API_PORT=5020
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    - DDD_ARCHITECTURE=true
    - DDD_CONFIG_FILE=config/ddd_config.yaml
    # Network resilience for agent orchestration
    - HTTP_CONNECTION_POOL_SIZE=10
    - HTTP_MAX_KEEPALIVE_CONNECTIONS=5
    - HTTP_TIMEOUT=45
    - CIRCUIT_BREAKER_FAILURE_THRESHOLD=3
    - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=45
    - RETRY_MAX_ATTEMPTS=2
    - RETRY_BACKOFF_FACTOR=2.0
    - AGENT_COMMUNICATION_TIMEOUT=30
    ports:
    - 8120:3000
    - 8087:5020
    depends_on:
      redis:
        condition: service_healthy
      doc_store:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5087/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    profiles:
    - all
    - core
    working_dir: /app
    volumes:
    - ./services/analysis-service:/app/services/analysis-service:rw
  doc_store:
    build:
      context: .
      dockerfile: services/doc_store/Dockerfile
    volumes:
    - ./:/app:ro
    - ./services/doc_store:/app/services/doc_store:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=doc_store
    - SERVICE_API_PORT=5087
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    ports:
    - 8086:5087
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5010/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    profiles:
    - all
    - core
    working_dir: /app
  discovery-agent:
    build:
      context: .
      dockerfile: services/discovery-agent/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=discovery-agent
    - SERVICE_API_PORT=5045
    - ENVIRONMENT=development
    ports:
    - 8131:3000
    - 8095:5045
    volumes:
    - ./services/discovery-agent:/app/services/discovery-agent:rw
    depends_on:
      orchestrator:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5045/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    profiles:
    - all
    - development
    working_dir: /app
  ollama:
    build: ./services/ollama
    ports:
    - 8123:3000
    - 8090:11434
    volumes:
    - ./:/app:ro
    - ./services/ollama:/app/services/ollama:rw
    environment:
    - OLLAMA_API_HOST=0.0.0.0
    - SERVICE_NAME=ollama
    - PYTHONPATH=/app
    networks:
    - hackathon_default
    profiles:
    - all
    - ai_services
    restart: unless-stopped
    working_dir: /app
    depends_on:
    - redis
  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    volumes:
    - ./:/app:ro
    - ./services/llm-gateway:/app/services/llm-gateway:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=llm-gateway
    - SERVICE_API_PORT=5055
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - OLLAMA_ENDPOINT=http://ollama:11434
    - EXTERNAL_OPENAI_API_KEY=${EXTERNAL_OPENAI_API_KEY:-}
    - EXTERNAL_ANTHROPIC_API_KEY=${EXTERNAL_ANTHROPIC_API_KEY:-}
    - BEDROCK_ENDPOINT=http://bedrock-proxy:5002/invoke
    - GROK_API_KEY=${GROK_API_KEY:-}
    - SENSITIVE_KEYWORDS=password,secret,token,key,credential,confidential,internal
    - SENSITIVITY_THRESHOLD=0.7
    - SECURE_ONLY_MODELS=ollama,bedrock
    - ALL_PROVIDERS=bedrock,ollama,openai,anthropic,grok
    - CACHE_MAX_SIZE=1000
    - CACHE_DEFAULT_TTL=3600
    - CACHE_CLEANUP_INTERVAL=300
    - RATE_LIMIT_REQUESTS_PER_MINUTE=60
    - RATE_LIMIT_REQUESTS_PER_HOUR=1000
    - RATE_LIMIT_TOKENS_PER_MINUTE=50000
    - RATE_LIMIT_BURST_LIMIT=10
    - RATE_LIMIT_COOLDOWN_SECONDS=60
    # Redis network optimizations for high-throughput caching
    - REDIS_CONNECTION_POOL_SIZE=15
    - REDIS_MAX_CONNECTIONS=25
    - REDIS_SOCKET_TIMEOUT=5
    - REDIS_SOCKET_CONNECT_TIMEOUT=5
    - REDIS_SOCKET_KEEPALIVE=true
    - REDIS_HEALTH_CHECK_INTERVAL=30
    - REDIS_RETRY_ON_TIMEOUT=true
    - REDIS_MAX_RETRIES=3
    # Advanced Redis features for same-network services
    - REDIS_CONNECTION_MULTIPLEXING=true
    - REDIS_PUBSUB_ENABLED=true
    - REDIS_DISTRIBUTED_LOCKING=true
    - REDIS_CACHE_SHARING=true
    - REDIS_SESSION_SHARING=true
    # Network-aware session management
    - SESSION_SHARING_ENABLED=true
    - DISTRIBUTED_SESSIONS_ENABLED=true
    - SESSION_REPLICATION_ENABLED=false
    - SESSION_STICKY_ROUTING=false
    - SESSION_AFFINITY_ENABLED=false
    - SESSION_TIMEOUT_GLOBAL=3600
    - SESSION_CLEANUP_INTERVAL=300
    - SESSION_ENCRYPTION_ENABLED=true
    - REDIS_EVENT_BUS_ENABLED=true
    # Event-driven architecture optimizations
    - EVENT_BUS_ENABLED=true
    - EVENT_PUBLISHING_ENABLED=true
    - EVENT_SUBSCRIPTION_ENABLED=true
    - EVENT_ROUTING_OPTIMIZED=true
    - EVENT_DEDUPLICATION_ENABLED=true
    - EVENT_PERSISTENCE_ENABLED=true
    - EVENT_REPLAY_ENABLED=false
    - EVENT_FILTERING_ENABLED=true
    - EVENT_METRICS_ENABLED=true
    # Advanced distributed caching strategies
    - DISTRIBUTED_CACHE_ENABLED=true
    - CACHE_SHARING_ENABLED=true
    - CACHE_INVALIDATION_DISTRIBUTED=true
    - CACHE_REPLICATION_ENABLED=false
    - CACHE_CONSISTENCY_STRATEGY=eventual
    - CACHE_WARMUP_ENABLED=true
    - CACHE_PRELOAD_ENABLED=false
    - CACHE_COMPRESSION_LEVEL=6
    - CACHE_SERIALIZATION_FORMAT=json
    - REDIS_CLUSTER_MODE=false
    - REDIS_SENTINEL_ENABLED=false
    # Network resilience for external API routing
    - HTTP_CONNECTION_POOL_SIZE=12
    - HTTP_MAX_KEEPALIVE_CONNECTIONS=6
    - HTTP_TIMEOUT=60
    - PROVIDER_TIMEOUT=45
    - CIRCUIT_BREAKER_FAILURE_THRESHOLD=2
    - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=120
    - RETRY_MAX_ATTEMPTS=1
    - RETRY_BACKOFF_FACTOR=2.0
    - EXTERNAL_API_TIMEOUT=30
    ports:
    - 8127:3000
    - 8092:5055
    depends_on:
      redis:
        condition: service_healthy
      bedrock-proxy:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5055/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      hackathon_default:
        aliases:
          - ai-gateway
          - llm-api
    profiles:
    - all
    - ai_services
    working_dir: /app
  summarizer-hub:
    build:
      context: .
      dockerfile: services/summarizer-hub/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=summarizer-hub
    - SERVICE_API_PORT=5160
    - OLLAMA_API_HOST=http://ollama:11434
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    ports:
    - 8124:3000
    - 5160:5160
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5160/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - all
    - ai_services
    working_dir: /app
    volumes:
    - ./services/summarizer-hub:/app/services/summarizer-hub:rw
    - ./services/shared:/app/services/shared:rw
    networks:
    - hackathon_default
    depends_on:
    - redis
  bedrock-proxy:
    build:
      context: .
      dockerfile: services/bedrock-proxy/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - SERVICE_API_PORT=5002
    - SERVICE_NAME=bedrock-proxy
    ports:
    - 8126:3000
    - 5002:5002
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5002/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - ai_services
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/bedrock-proxy:/app/services/bedrock-proxy:rw
    networks:
    - hackathon_default
    depends_on:
    - redis
  notification-service:
