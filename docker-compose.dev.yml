    networks:
    - hackathon_default
    profiles:
    - all
    - development
    restart: unless-stopped
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/notification-service:/app/services/notification-service:rw
    depends_on:
    - redis
  user-store:
    build:
      context: .
      dockerfile: services/user-store/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=user-store
    - SERVICE_API_PORT=5150
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - TEST_CONFIG_MODIFIED=true
    - META_ORCHESTRATOR_TEST=success
    - MONITORING_DEMO=true
    - LIVE_TEST_CONFIG=demo_success
    ports:
    - 8142:3000
    - 8106:5150
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5150/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    profiles:
    - all
    - core
    - utility
    working_dir: /app
    volumes:
    - ./services/user-store:/app/services/user-store:rw
    - ./services/shared:/app/services/shared:rw
  expert-finder-service:
    build:
      context: ./services/expert-finder-service
      dockerfile: Dockerfile
    environment:
    - SERVICE_PORT=5160
    - USER_STORE_URL=http://user-store:5150
    - DOC_STORE_URL=http://doc-store:5087
    - EXTERNAL_SERVICE_STORE_URL=http://external-service-store:5140
    - LLM_GATEWAY_URL=http://llm-gateway:8100
    - ENVIRONMENT=development
    ports:
    - 5160:5160
    depends_on:
      user-store:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5160/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    profiles:
    - all
    - development
    working_dir: /app
    volumes:
    - ./services/expert-finder-service:/app:rw
  prompt_store:
    build:
      context: .
      dockerfile: services/prompt_store/Dockerfile
    volumes:
    - ./:/app:ro
    - ./services/prompt_store:/app/services/prompt_store:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=prompt_store
    - SERVICE_API_PORT=5110
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    # Database network optimizations
    - DB_CONNECTION_POOL_SIZE=10
    - DB_MAX_CONNECTIONS=20
    - DB_CONNECTION_TIMEOUT=30
    - DB_CONNECTION_RETRY_ATTEMPTS=3
    - DB_CONNECTION_RETRY_DELAY=1.0
    - DB_HEALTH_CHECK_INTERVAL=60
    # Data consistency and synchronization for network-shared data
    - DATA_CONSISTENCY_ENABLED=true
    - DISTRIBUTED_TRANSACTIONS_ENABLED=false
    - CACHE_INVALIDATION_STRATEGY=immediate
    - DATA_REPLICATION_ENABLED=false
    - CONSISTENCY_LEVEL=eventual
    - CONFLICT_RESOLUTION_STRATEGY=last_write_wins
    - DATA_SYNC_INTERVAL=30
    - SHARED_STATE_MANAGEMENT=true
    ports:
    - 8133:3000
    - 8097:5110
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5110/health
