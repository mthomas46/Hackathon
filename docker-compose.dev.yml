      retries: 3
    profiles:
    - all
    - development
    working_dir: /app
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=notification-service
    - SERVICE_API_PORT=5130
    - ENVIRONMENT=development
    ports:
    - 8096:5130
    healthcheck:
      test:
