    volumes:
    - ./services/discovery-agent:/app/services/discovery-agent:rw
    depends_on:
      orchestrator:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5045/health
      interval: 30s
