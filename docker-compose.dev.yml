        condition: service_healthy
      doc_store:
        condition: service_started
      llm-gateway:
        condition: service_started
      mock-data-generator:
        condition: service_started
      analysis-service:
        condition: service_started
      orchestrator:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5075/health
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    profiles:
    - all
    - simulation
    - development
    - production
    restart: unless-stopped
    working_dir: /app
  simulation-dashboard:
    build:
      context: .
      dockerfile: services/simulation-dashboard/Dockerfile
    volumes:
    - ./services/shared:/app/services/shared:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=simulation-dashboard
    - DASHBOARD_ENVIRONMENT=development
    - DASHBOARD_DEBUG=false
    - DASHBOARD_API_PORT=8501
    - DASHBOARD_API_HOST=0.0.0.0
    - DASHBOARD_SIMULATION_SERVICE_API_HOST=project-simulation
    - DASHBOARD_SIMULATION_SERVICE_API_PORT=5075
    - DASHBOARD_ANALYSIS_SERVICE_URL=http://analysis-service:5080
    - DASHBOARD_HEALTH_SERVICE_URL=http://notification-service:5130
