    volumes:
    - ./services/interpreter:/app/services/interpreter:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=interpreter
    - SERVICE_API_PORT=5120
    - INTERPRETER_SERVICE_API_HOST=0.0.0.0
    - ENVIRONMENT=development
    ports:
