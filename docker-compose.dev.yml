      - -f
      - http://localhost:5130/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - development
    restart: unless-stopped
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/notification-service:/app/services/notification-service:rw
    depends_on:
    - redis
  prompt_store:
    build:
      context: .
      dockerfile: services/prompt_store/Dockerfile
    volumes:
    - ./:/app:ro
    - ./services/prompt_store:/app/services/prompt_store:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=prompt_store
    - SERVICE_API_PORT=5110
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    ports:
    - 8097:5110
    depends_on:
