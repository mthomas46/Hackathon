services:
  redis:
    build: ./services/redis
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    environment:
      SERVICE_NAME: redis
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=orchestrator
    - SERVICE_API_PORT=5099
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    ports:
    - 8085:5099
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5099/health
      interval: 30s
      timeout: 10s
      retries: 3
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/orchestrator:/app/services/orchestrator:rw
    profiles:
    - all
  doc_store:
    build:
      context: .
      dockerfile: services/doc_store/Dockerfile
    volumes:
    - ./:/app:ro
    - ./services/doc_store:/app/services/doc_store:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=doc_store
    - SERVICE_API_PORT=5087
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    ports:
    - 8086:5087
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5010/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - core
    working_dir: /app
  analysis-service:
    build:
      context: .
      dockerfile: services/analysis-service/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=analysis-service
    - SERVICE_API_PORT=5020
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    - DDD_ARCHITECTURE=true
    - DDD_CONFIG_FILE=config/ddd_config.yaml
    ports:
    - 8087:5020
    depends_on:
      redis:
        condition: service_healthy
      doc_store:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5020/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - core
    working_dir: /app
    volumes:
    - ./services/analysis-service:/app/services/analysis-service:rw
  source-agent:
    container_name: hackathon-source-agent-1
    build:
      context: .
      dockerfile: services/source-agent/Dockerfile
    ports:
    - 8088:5085
    environment:
    - SERVICE_NAME=source-agent
    - SERVICE_API_PORT=5085
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    - DOC_STORE_URL=http://doc_store:5087
    - PYTHONPATH=/app
    - REDIS_API_HOST=redis
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5085/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - core
    restart: unless-stopped
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/source-agent:/app/services/source-agent:rw
    depends_on:
    - redis
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=frontend
    - SERVICE_API_PORT=3000
    - FRONTEND_SERVICE_API_HOST=0.0.0.0
    - ENVIRONMENT=development
    ports:
    - 8089:3000
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
      analysis-service:
        condition: service_started
      unified-api-dashboard:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -s
      - http://localhost:3000/
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - core
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/frontend:/app/services/frontend:rw
  ollama:
    build: ./services/ollama
    ports:
    - 8090:11434
    volumes:
    - ./:/app:ro
    - ./services/ollama:/app/services/ollama:rw
    environment:
    - OLLAMA_API_HOST=0.0.0.0
    - SERVICE_NAME=ollama
    - PYTHONPATH=/app
    profiles:
    - all
    - ai_services
    restart: unless-stopped
    working_dir: /app
    depends_on:
    - redis
  summarizer-hub:
    build:
      context: .
      dockerfile: services/summarizer-hub/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=summarizer-hub
    - SERVICE_API_PORT=5160
    - OLLAMA_API_HOST=http://host.docker.internal:11434
    - ENVIRONMENT=development
    - LOG_COLLECTOR_URL=http://log-collector:5080
    - LOG_COLLECTOR_ENABLED=true
    ports:
    - 5160:5160
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5160/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
    - all
    - ai_services
    working_dir: /app
    volumes:
    - ./services/summarizer-hub:/app/services/summarizer-hub:rw
    - ./services/shared:/app/services/shared:rw
    depends_on:
    - redis
  architecture-digitizer:
    build:
      context: .
      dockerfile: services/architecture-digitizer/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=architecture-digitizer
    - SERVICE_API_PORT=5105
    - ENVIRONMENT=development
    ports:
    - 8091:5105
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5105/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - ai_services
    working_dir: /app
    volumes:
    - ./services/architecture-digitizer:/app/services/architecture-digitizer:rw
    depends_on:
    - redis
  bedrock-proxy:
    build:
      context: .
      dockerfile: services/bedrock-proxy/Dockerfile
    environment:
    - PYTHONPATH=/app
    - ENVIRONMENT=development
    - SERVICE_API_PORT=5002
    - SERVICE_NAME=bedrock-proxy
    ports:
    - 5002:5002
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5002/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - ai_services
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./services/bedrock-proxy:/app/services/bedrock-proxy:rw
    depends_on:
    - redis
  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    volumes:
    - ./:/app:ro
    - ./services/llm-gateway:/app/services/llm-gateway:rw
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=llm-gateway
    - SERVICE_API_PORT=5055
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - OLLAMA_ENDPOINT=http://ollama:11434
    - EXTERNAL_OPENAI_API_KEY=${EXTERNAL_OPENAI_API_KEY:-}
    - EXTERNAL_ANTHROPIC_API_KEY=${EXTERNAL_ANTHROPIC_API_KEY:-}
    - BEDROCK_ENDPOINT=http://bedrock-proxy:5002/invoke
    - GROK_API_KEY=${GROK_API_KEY:-}
    - SENSITIVE_KEYWORDS=password,secret,token,key,credential,confidential,internal
    - SENSITIVITY_THRESHOLD=0.7
    - SECURE_ONLY_MODELS=ollama,bedrock
    - ALL_PROVIDERS=bedrock,ollama,openai,anthropic,grok
    - CACHE_MAX_SIZE=1000
    - CACHE_DEFAULT_TTL=3600
    - CACHE_CLEANUP_INTERVAL=300
    - RATE_LIMIT_REQUESTS_PER_MINUTE=60
    - RATE_LIMIT_REQUESTS_PER_HOUR=1000
    - RATE_LIMIT_TOKENS_PER_MINUTE=50000
    - RATE_LIMIT_BURST_LIMIT=10
    - RATE_LIMIT_COOLDOWN_SECONDS=60
    ports:
    - 8092:5055
    depends_on:
      redis:
        condition: service_healthy
      bedrock-proxy:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5055/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - ai_services
    working_dir: /app
  mock-data-generator:
    build:
      context: .
      dockerfile: services/mock-data-generator/Dockerfile
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=mock-data-generator
    - SERVICE_API_PORT=5065
    - MOCK_DATA_GENERATOR_API_HOST=0.0.0.0
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LLM_GATEWAY_URL=http://llm-gateway:5055
    - DOC_STORE_URL=http://doc_store:5087
    ports:
    - 8093:5065
    depends_on:
      llm-gateway:
        condition: service_healthy
      doc_store:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5065/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - all
    - ai_services
