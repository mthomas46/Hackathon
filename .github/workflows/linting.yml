# 🔧 LLM Documentation Ecosystem - Linting Pipeline
# ============================================================================
# Dedicated linting workflow with comprehensive code quality checks
# ============================================================================

name: Code Quality & Linting

on:
  push:
    branches: [ main, develop, simulation ]
    paths:
      - 'services/**'
      - 'scripts/**'
      - '*.py'
      - 'requirements-dev.txt'
      - '.github/workflows/linting.yml'
  pull_request:
    branches: [ main, develop, simulation ]
    paths:
      - 'services/**'
      - 'scripts/**'
      - '*.py'
      - 'requirements-dev.txt'

env:
  PYTHON_VERSION: '3.13'

jobs:
  linting:
    name: "🔧 Comprehensive Linting"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: 📦 Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🔄 Import Sorting (isort)
      run: |
        echo "🔄 Checking import sorting..."
        if ! isort --profile=black --line-length=120 --check-only --diff services/ scripts/ *.py; then
          echo "❌ Import sorting failed. Run: isort --profile=black --line-length=120 services/ scripts/ *.py"
          exit 1
        fi
        echo "✅ Import sorting passed"

    - name: 🎨 Code Formatting (Black)
      run: |
        echo "🎨 Checking code formatting..."
        if ! black --line-length=120 --check --diff services/ scripts/ *.py; then
          echo "❌ Code formatting failed. Run: black --line-length=120 services/ scripts/ *.py"
          exit 1
        fi
        echo "✅ Code formatting passed"

    - name: 🐛 Linting (flake8)
      run: |
        echo "🐛 Running comprehensive linting..."
        if ! flake8 services/ scripts/ *.py --max-line-length=120 --extend-ignore=E203,W503 --max-complexity=10 --count --statistics; then
          echo "❌ Linting failed. Fix the issues shown above."
          exit 1
        fi
        echo "✅ Linting passed"

    - name: 📝 Docstring Formatting (docformatter)
      run: |
        echo "📝 Checking docstring formatting..."
        if ! docformatter --check --pre-summary-newline --recursive services/ scripts/ *.py; then
          echo "❌ Docstring formatting failed. Run: docformatter --in-place --pre-summary-newline --recursive services/ scripts/ *.py"
          exit 1
        fi
        echo "✅ Docstring formatting passed"

    - name: 🔒 Security Linting (Bandit)
      run: |
        echo "🔒 Running security analysis..."
        pip install bandit[toml]
        bandit -r services/ scripts/ --exclude-dir="*/tests/*,*/test_venv/*" -f json -o security-report.json --exit-zero || true
        echo "✅ Security analysis completed"

    - name: 📊 Generate linting report
      run: |
        echo "## 🔧 Linting Results" >> linting-report.md
        echo "- ✅ Import sorting: PASSED" >> linting-report.md
        echo "- ✅ Code formatting: PASSED" >> linting-report.md
        echo "- ✅ Linting: PASSED" >> linting-report.md
        echo "- ✅ Docstring formatting: PASSED" >> linting-report.md
        echo "- ✅ Security analysis: COMPLETED" >> linting-report.md
        echo "" >> linting-report.md
        echo "### 📈 Code Quality Metrics" >> linting-report.md
        echo "- Python files processed: $(find services/ scripts/ *.py -name "*.py" 2>/dev/null | wc -l)" >> linting-report.md
        echo "- Lines of code: $(find services/ scripts/ *.py -name "*.py" -exec wc -l {} \; 2>/dev/null | awk '{sum += $1} END {print sum}')" >> linting-report.md

    - name: 📤 Upload linting report
      uses: actions/upload-artifact@v4
      with:
        name: linting-report
        path: linting-report.md

    - name: 📤 Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.json
