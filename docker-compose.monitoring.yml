services:
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
    - 9090:9090
    volumes:
    - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./infrastructure/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --storage.tsdb.retention.time=200h
    - --web.enable-lifecycle
    networks:
    - hackathon_monitoring
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.25.0
    ports:
    - 9093:9093
    volumes:
    - ./infrastructure/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager_data:/alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    networks:
    - hackathon_monitoring
    restart: unless-stopped
  pushgateway:
    image: prom/pushgateway:v1.5.1
    ports:
    - 9091:9091
    networks:
    - hackathon_monitoring
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.6.1
    ports:
    - 9100:9100
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    command:
    - --path.procfs=/host/proc
    - --path.rootfs=/rootfs
    - --path.sysfs=/host/sys
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
    - hackathon_monitoring
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
    - 3001:3000
    networks:
    - hackathon_monitoring
    depends_on:
    - prometheus
    - jaeger
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit
        1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.50
    environment:
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_API_HOST_API_PORT: 9411
    ports:
    - 8085:16686
    - 8085:14268
    - 8085:9411
    volumes:
    - jaeger_data:/tmp
    networks:
    - hackathon_monitoring
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:16686
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  jaeger_data:
    driver: local
  alertmanager_data:
    driver: local
networks:
  hackathon_monitoring:
    driver: bridge
    name: monitoring-network
  hackathon_default:
    driver: bridge
