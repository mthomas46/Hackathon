# Pre-commit hooks for code quality enforcement
# This ensures consistent code quality across all commits

repos:
  # Code formatting and imports
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.13
        exclude: ^services/.*\.py$  # Exclude service files for now to avoid conflicts

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: ^services/.*\.py$  # Exclude service files for now

  # Basic linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]
        exclude: ^services/.*\.py$  # Exclude service files for now

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: ["--ignore-missing-imports"]
        files: ^services/(shared|analysis-service)/.*\.py$
        exclude: ^services/.*/tests/.*$

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        files: ^services/.*\.py$
        exclude: ^services/.*/tests/.*

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        files: \.(yaml|yml)$
      - id: check-json
        files: \.(json)$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.(md|rst)$

  # Audit framework validation
  - repo: local
    hooks:
      - id: audit-framework-check
        name: Audit Framework Validation
        entry: python scripts/audit-framework/audit_cli.py audit --service shared --profile ci_comprehensive --output json
        language: system
        pass_filenames: false
        files: ^services/shared/.*\.py$
        description: "Run audit check on shared service when files change"