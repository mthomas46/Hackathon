# 🚀 Pre-commit Configuration with Audit Framework Integration
# Comprehensive code quality checks and audit integration

ci:
  # Auto-update pre-commit hooks
  autofix_commit_msg: "🔧 [pre-commit.ci] auto fixes from pre-commit.com hooks"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "🔄 [pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false

repos:
  # ========================================
  # 🔧 CODE QUALITY & FORMATTING
  # ========================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: "Remove trailing whitespace"
        description: "Remove trailing whitespace from all files"
        types: [text]
        stages: [commit]

      - id: end-of-file-fixer
        name: "Fix end of files"
        description: "Ensure files end with a newline"
        types: [text]
        stages: [commit]

      - id: check-yaml
        name: "Check YAML syntax"
        description: "Validate YAML file syntax"
        files: \.(yaml|yml)$
        stages: [commit]

      - id: check-json
        name: "Check JSON syntax"
        description: "Validate JSON file syntax"
        files: \.json$
        stages: [commit]

      - id: check-merge-conflict
        name: "Check for merge conflicts"
        description: "Check for unresolved merge conflicts"
        stages: [commit]

      - id: check-added-large-files
        name: "Check for large files"
        description: "Prevent accidentally adding large files"
        args: ['--maxkb=500']
        stages: [commit]

      - id: mixed-line-ending
        name: "Fix line endings"
        description: "Normalize line endings to LF"
        types: [text]
        stages: [commit]

  # ========================================
  # 🐍 PYTHON SPECIFIC CHECKS
  # ========================================

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: "Format Python code"
        description: "Format Python code with Black"
        language_version: python3
        types: [python]
        stages: [commit]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: "Sort Python imports"
        description: "Sort Python imports with isort"
        args: ["--profile", "black", "--filter-files"]
        types: [python]
        stages: [commit]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: "Check Python style"
        description: "Check Python code style with flake8"
        types: [python]
        stages: [commit]
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: "Type check Python"
        description: "Check Python type hints with mypy"
        additional_dependencies: [types-all]
        types: [python]
        stages: [commit]
        args: ["--ignore-missing-imports", "--no-strict-optional"]

  # ========================================
  # 🔍 AUDIT FRAMEWORK INTEGRATION
  # ========================================

  - repo: local
    hooks:
      - id: audit-framework-check
        name: "Audit Framework Quality Check"
        description: "Run audit framework quality checks on modified services"
        entry: bash
        language: system
        files: ^services/.*\.py$
        stages: [commit]
        pass_filenames: false
        args:
          - |
            #!/bin/bash
            set -e

            echo "🔍 Running Audit Framework Quality Check..."

            # Check if audit framework is available
            if ! python3 -c "from audit_framework import AuditFramework" 2>/dev/null; then
              echo "⚠️  Audit framework not available, skipping quality check"
              exit 0
            fi

            # Get modified services
            MODIFIED_SERVICES=$(git diff --cached --name-only | grep '^services/' | cut -d'/' -f2 | sort | uniq)

            if [ -z "$MODIFIED_SERVICES" ]; then
              echo "✅ No service files modified, skipping audit check"
              exit 0
            fi

            echo "Modified services: $MODIFIED_SERVICES"

            # Run quick audit on modified services
            for service in $MODIFIED_SERVICES; do
              if [ -d "services/$service" ]; then
                echo "Auditing $service..."
                if ! python3 scripts/audit-framework/audit_cli.py audit --service "$service" --profile ci_fast --output json > /dev/null 2>&1; then
                  echo "❌ Audit failed for $service"
                  exit 1
                fi
                echo "✅ $service audit passed"
              fi
            done

            echo "🎉 All modified services passed audit checks"

  - repo: local
    hooks:
      - id: quality-gate-check
        name: "Quality Gate Enforcement"
        description: "Enforce quality gates on all services"
        entry: bash
        language: system
        stages: [push]
        pass_filenames: false
        args:
          - |
            #!/bin/bash
            set -e

            echo "🚨 Running Quality Gate Enforcement..."

            # Check if we're in CI environment
            if [ -n "$CI" ]; then
              echo "CI environment detected, running comprehensive checks..."
              QUALITY_PROFILE="ci_fast"
            else
              echo "Local environment, running standard checks..."
              QUALITY_PROFILE="standard"
            fi

            # Run quality gate check
            if ! python3 scripts/audit-framework/audit_cli.py audit --service shared --profile "$QUALITY_PROFILE" --output json > /tmp/quality-gate-check.json 2>/dev/null; then
              echo "❌ Quality gate check failed - audit framework not available"
              exit 1
            fi

            # Parse results
            SCORE=$(jq -r '.overall_score // 0' /tmp/quality-gate-check.json)
            CRITICAL_ISSUES=$(jq -r '.critical_issues_count // 0' /tmp/quality-gate-check.json)

            # Quality thresholds
            MIN_SCORE=60.0
            MAX_CRITICAL=5

            # Check quality gates
            if (( $(echo "$SCORE < $MIN_SCORE" | bc -l) )) || (( CRITICAL_ISSUES > MAX_CRITICAL )); then
              echo "❌ Quality gates failed!"
              echo "   - Score: $SCORE (minimum: $MIN_SCORE)"
              echo "   - Critical issues: $CRITICAL_ISSUES (maximum: $MAX_CRITICAL)"
              echo ""
              echo "Run 'make audit' locally to debug issues"
              exit 1
            fi

            echo "✅ Quality gates passed!"
            echo "   - Score: $SCORE/100"
            echo "   - Critical issues: $CRITICAL_ISSUES"

  # ========================================
  # 🔒 SECURITY CHECKS
  # ========================================

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.4
    hooks:
      - id: forbid-crlf
        name: "Forbid CRLF line endings"
        description: "Prevent CRLF line endings"
        types: [text]
        stages: [commit]

      - id: remove-tabs
        name: "Remove tabs"
        description: "Replace tabs with spaces"
        types: [text]
        stages: [commit]

  # ========================================
  # 📝 DOCUMENTATION CHECKS
  # ========================================

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.4
    hooks:
      - id: forbid-new-submodules
        name: "Forbid new submodules"
        description: "Prevent accidental addition of git submodules"
        stages: [commit]

# ========================================
# 📋 CONFIGURATION NOTES
# ========================================
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg  # For commit message checks
#
# Usage:
#   pre-commit run --all-files                 # Run on all files
#   pre-commit run --files services/shared/main.py  # Run on specific files
#   pre-commit run audit-framework-check       # Run specific hook
#
# CI Integration:
#   The audit framework hooks automatically detect CI environment
#   and adjust quality thresholds accordingly (ci_fast vs standard profiles)
#
# Emergency Bypass:
#   Use --no-verify flag to skip pre-commit checks if needed:
#   git commit --no-verify -m "Emergency commit"