services:
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

  ollama:
    image: ollama/ollama:latest
    environment:
    - OLLAMA_API_HOST=0.0.0.0
    networks:
    - hackathon_external
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:11434/api/tags
      interval: 60s
      timeout: 20s
      retries: 6
      start_period: 120s

  swagger-agent:
    image: python:3.12-slim
    working_dir: /svc
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic httpx &&
      uvicorn main:app --host 0.0.0.0 --port 5010"
    volumes:
    - ./services/swagger-agent:/svc
    ports:
    - 5010:5010
    depends_on:
      redis:
        condition: service_healthy

networks:
  hackathon_default:
    name: doc-ecosystem
    driver: bridge
  hackathon_external:
    driver: bridge
