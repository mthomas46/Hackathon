server:
  port: 5060
providers:
- name: ollama
  model: ${OLLAMA_MODEL:-llama3}
  endpoint: ${OLLAMA_ENDPOINT:-http://ollama-consistency:11434}
- name: openai
  model: ${OPENAI_MODEL:-gpt-4o}
  api_key: ${OPENAI_API_KEY:-}
- name: anthropic
  model: ${ANTHROPIC_MODEL:-claude-3.5-sonnet}
  api_key: ${ANTHROPIC_API_KEY:-}
- name: bedrock
  model: ${BEDROCK_MODEL:-anthropic.claude-3-sonnet-20240229-v1:0}
  endpoint: ${BEDROCK_ENDPOINT:-}
  region: ${BEDROCK_REGION:-us-east-1}
  api_key: ${BEDROCK_API_KEY:-}
aws:
  access_key_id: ${AWS_ACCESS_KEY_ID:-}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY:-}
  session_token: ${AWS_SESSION_TOKEN:-}
  region: ${AWS_REGION:-us-east-1}
security:
  enable_ssl: ${SSL_ENABLED:-false}
  ssl_cert_path: ${SSL_CERT_PATH:-}
  ssl_key_path: ${SSL_KEY_PATH:-}
  cors_origins: ${CORS_ORIGINS:-http://localhost:3000}
  rate_limiting_enabled: ${RATE_LIMITING_ENABLED:-true}
  max_request_size: ${MAX_REQUEST_SIZE:-10485760}
  timeout_seconds: ${TIMEOUT_SECONDS:-30}
  enable_request_logging: ${REQUEST_LOGGING:-false}
  enable_metrics: ${METRICS_ENABLED:-true}
development:
  debug_mode: ${DEBUG_MODE:-false}
  enable_cors: ${ENABLE_CORS:-true}
  mock_external_services: ${MOCK_EXTERNAL:-false}
  log_level: ${LOG_LEVEL:-INFO}
