services:
  summarizer-hub:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - summarizer-hub_code:/app:rw
    environment:
    - OLLAMA_API_HOST=http://host.docker.internal:11434
    - ENVIRONMENT=development
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn httpx pydantic boto3
      botocore && python services/summarizer-hub/main.py"
    ports:
    - 8085:5060
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5060/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

volumes:
  redis_data:
    driver: local
  summarizer-hub_code:
    driver: local

networks:
  hackathon_default:
    driver: bridge
