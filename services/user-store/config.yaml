# User Store Service Configuration
# Inherits from shared base_config.yaml

# Override server port for user-store
server:
  host: ${SERVER_API_HOST:-0.0.0.0}
  port: 5150
  debug: ${DEBUG:-false}
  workers: ${SERVER_WORKERS:-1}
  timeout: ${SERVER_TIMEOUT:-30}

# Service metadata
service:
  name: "user-store"
  description: "User Store Service"
  version: "1.0.0"

# Service dependencies
dependencies:
  - "document-store"
  - "notification-service"

# Repository configuration
repository:
  type: ${REPOSITORY_TYPE:-in_memory}
  connection_string: ${REPOSITORY_CONNECTION_STRING:-sqlite:///user_store.db}

# Security configuration
security:
  jwt_secret: ${JWT_SECRET:-change-me-in-production}
  token_expiry_hours: ${JWT_TOKEN_EXPIRY_HOURS:-24}

# Notification configuration
notifications:
  default_channels: ["email"]
  max_retries: 3
  retry_delay_seconds: 300

# Caching configuration
cache:
  ttl_seconds: 3600
  max_size: 1000
