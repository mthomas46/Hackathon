services:
  user-store:
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic && python
      services/user-store/main.py"
    environment:
    - ENVIRONMENT=development
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5150/health
      timeout: 10s
    image: python:3.12-slim
    ports:
    - 8085:5150
    volumes:
    - ./:/app:ro
    - user-store_code:/app:rw
    working_dir: /app
    networks:
    - hackathon_default
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

