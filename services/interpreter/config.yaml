server:
  port: ${INTERPRETER_PORT:-5120}
services:
  prompt_store_url: ${PROMPT_STORE_URL:-http://prompt-store:5110}
  orchestrator_url: ${ORCHESTRATOR_URL:-http://orchestrator:5099}
  analysis_service_url: ${ANALYSIS_SERVICE_URL:-http://analysis-service:5020}
security:
  enable_ssl: ${SSL_ENABLED:-false}
  ssl_cert_path: ${SSL_CERT_PATH:-}
  ssl_key_path: ${SSL_KEY_PATH:-}
  cors_origins: ${CORS_ORIGINS:-http://localhost:3000}
  rate_limiting_enabled: ${RATE_LIMITING_ENABLED:-true}
  max_request_size: ${MAX_REQUEST_SIZE:-10485760}
  timeout_seconds: ${TIMEOUT_SECONDS:-30}
  enable_request_logging: ${REQUEST_LOGGING:-false}
  enable_metrics: ${METRICS_ENABLED:-true}
development:
  debug_mode: ${DEBUG_MODE:-false}
  enable_cors: ${ENABLE_CORS:-true}
  mock_external_services: ${MOCK_EXTERNAL:-false}
  log_level: ${LOG_LEVEL:-INFO}
