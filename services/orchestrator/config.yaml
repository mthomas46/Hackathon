# Orchestrator-specific configuration
# Inherits from shared base_config.yaml

# Override server port for orchestrator
server:
  port: 5099

# Orchestrator-specific service URLs
services:
  summarizer_hub_url: ${SUMMARIZER_HUB_URL:-http://summarizer-hub:5160}
  analysis_service_url: ${ANALYSIS_SERVICE_URL:-http://analysis-service:5020}
  doc_store_url: ${DOC_STORE_URL:-http://doc_store:5087}
  discovery_agent_url: ${DISCOVERY_AGENT_URL:-http://discovery-agent:5045}
  llm_gateway_url: ${LLM_GATEWAY_URL:-http://llm-gateway:5055}
  prompt_store_url: ${PROMPT_STORE_URL:-http://prompt_store:5095}
  source_agent_url: ${SOURCE_AGENT_URL:-http://source-agent:5085}

# Orchestrator-specific settings
registry:
  enabled: true
