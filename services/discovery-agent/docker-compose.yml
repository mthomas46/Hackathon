# =============================================================================
# Discovery Agent Service - Docker Compose Configuration
# =============================================================================
# Refactored: October 2025
# Version: 2.0.0
# Architecture: DDD + Clean Architecture
# Quality: A+

version: '3.8'

services:
  discovery-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: discovery-agent:2.0.0
    container_name: discovery-agent
    
    # Port configuration (aligned with registry)
    ports:
      - "5050:5050"  # HTTP API port
      - "5051:5051"  # Internal service port
    
    # Environment configuration
    environment:
      # Service configuration
      - SERVICE_NAME=discovery-agent
      - SERVICE_API_PORT=5050
      - SERVICE_INTERNAL_PORT=5051
      - SERVER_API_HOST=0.0.0.0
      - ENVIRONMENT=development
      
      # External service URLs
      - ORCHESTRATOR_URL=http://orchestrator:5099
      - LOG_COLLECTOR_URL=http://log-collector:5060
      
      # Timeouts (in seconds)
      - SERVICE_DISCOVERY_TIMEOUT=30.0
      - HEALTH_CHECK_TIMEOUT=5.0
      - TOOL_REGISTRATION_TIMEOUT=3.0
      - ENDPOINT_VALIDATION_TIMEOUT=3.0
      
      # Python configuration
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    
    # Volume mounts (development mode)
    volumes:
      - ./domain:/app/domain:ro
      - ./application:/app/application:ro
      - ./infrastructure:/app/infrastructure:ro
      - ./presentation:/app/presentation:ro
      - ./tests:/app/tests:ro
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
    
    # Health check (updated port)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Dependencies (orchestrator is critical)
    depends_on:
      orchestrator:
        condition: service_healthy
        required: true
      log-collector:
        condition: service_started
        required: false
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network configuration
    networks:
      - hackathon_default
    
    # Labels for ecosystem
    labels:
      - "ecosystem.service=discovery-agent"
      - "ecosystem.version=2.0.0"
      - "ecosystem.tier=3"
      - "ecosystem.role=integration"
      - "ecosystem.http_port=5050"
      - "ecosystem.internal_port=5051"
      - "ecosystem.quality=A+"
      - "ecosystem.test_coverage=80%+"
      - "ecosystem.architecture=DDD+CleanArchitecture"
      - "ecosystem.refactored=2025-10-09"

  # Orchestrator service (dependency)
  orchestrator:
    image: orchestrator:latest
    container_name: orchestrator
    ports:
      - "5099:5099"
    environment:
      - SERVICE_API_PORT=5099
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hackathon_default
    restart: unless-stopped

  # Log-collector service (optional dependency)
  log-collector:
    image: log-collector:latest
    container_name: log-collector
    ports:
      - "5060:5060"
    environment:
      - SERVICE_API_PORT=5060
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5060/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hackathon_default
    restart: unless-stopped

# Network configuration
networks:
  hackathon_default:
    driver: bridge
    name: hackathon_network

# Volume configuration
volumes:
  discovery_agent_logs:
    driver: local
  discovery_agent_data:
    driver: local
