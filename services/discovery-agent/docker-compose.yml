services:
  discovery-agent:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - discovery-agent_code:/app:rw
    environment:
    - ENVIRONMENT=development
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic httpx &&
      python services/discovery-agent/main.py"
    ports:
    - 8085:5045
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5045/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

volumes:
  redis_data:
    driver: local
  discovery-agent_code:
    driver: local

networks:
  hackathon_default:
    driver: bridge
