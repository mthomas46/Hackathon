[pytest]
# Pytest configuration for kafka-ingestion-service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (external dependencies)
    functional: Functional/E2E tests (complete workflows)
    slow: Slow-running tests
    kafka: Tests requiring Kafka
    redis: Tests requiring Redis

# Coverage settings
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --cov-fail-under=85

# Async support
asyncio_mode = auto

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

