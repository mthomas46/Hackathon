[pytest]
# pytest configuration for code-analyzer service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=65
    -ra

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with dependencies)
    e2e: End-to-end tests (slowest, full workflow)
    api: API endpoint tests (requires FastAPI TestClient)
    performance: Performance and load tests
    security: Security tests
    slow: Tests that take significant time
    workflow: Workflow tests (real-world usage scenarios)
    domain: Domain layer tests
    application: Application layer tests
    infrastructure: Infrastructure layer tests
    presentation: Presentation/API layer tests

# Coverage configuration
[coverage:run]
source = .
omit = 
    */tests/*
    */conftest.py
    */__init__.py
    */venv/*
    */test_*.py
    */modules/*
    domain/exceptions.py
    domain/value_objects.py
    domain/services/analysis_processor.py
    domain/services/endpoint_extractor.py
    domain/services/style_manager.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

