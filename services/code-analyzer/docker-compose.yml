# Docker Compose configuration for code-analyzer service
# Can run standalone or as part of the ecosystem
# Last Updated: October 9, 2025

version: "3.8"

services:
  code-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: code-analyzer
    
    # Ports
    ports:
      - "6000:6000"  # HTTP API
      - "6001:6001"  # Internal communication
    
    # Environment variables
    environment:
      - SERVICE_NAME=code-analyzer
      - SERVICE_PORT=6000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PROFILE=${PROFILE:-development}
      - ENABLE_METRICS=true
      - ENABLE_TRACING=false
      - WORKERS=4
    
    # Networks
    networks:
      - hackathon_analysis
      - hackathon_default
    
    # Volumes (for development)
    volumes:
      - ./domain:/app/domain:ro
      - ./tests:/app/tests:ro
      - ./logs:/app/logs
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Labels
    labels:
      - "service=code-analyzer"
      - "tier=analysis"
      - "version=1.0.0"
      - "architecture=DDD"
      - "profile=analysis,dev,prod"

# Networks
networks:
  hackathon_analysis:
    name: hackathon_analysis
    driver: bridge
  
  hackathon_default:
    name: hackathon_default
    external: true

# Volumes
volumes:
  code_analyzer_logs:
    name: code_analyzer_logs
