[pytest]
# pytest configuration for data-services-dashboard

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths =
    tests/unit
    tests/integration
    tests/functional

# Add custom markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (with dependencies)
    functional: Functional tests (dashboard logic)
    api: API endpoint tests (requires FastAPI TestClient)
    slow: Marks tests as slow (for selective execution)

# Coverage configuration
addopts = 
    --cov=./
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --strict-markers
    -v

# Exclude specific files/directories from coverage
# Note: Excludes Streamlit UI files (hard to unit test) and standalone API app (tested via Phase 7)
omit =
    */__init__.py
    */tests/*
    */app.py
    */api_app.py
    */visualization/*
    */conftest.py
    */start.sh
    */test_generate_operations.py

# Minimum coverage percentage (fail if below)
# Note: 70% threshold for testable code (excludes Streamlit UI which is validated via Phase 7)
cov_fail_under = 70

# Asyncio mode
asyncio_mode = auto

# Log level
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

