# =============================================================================
# Data Services Dashboard - Docker Compose Configuration
# =============================================================================
# Hybrid Architecture: Streamlit UI (8501) + FastAPI REST API (8080)

version: '3.8'

services:
  data-services-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    
    image: data-services-dashboard:1.0.0
    container_name: data-services-dashboard
    
    # Ports
    ports:
      - "8501:8501"  # Streamlit UI (Web Interface)
      - "8080:8080"  # FastAPI REST API (System Interface)
    
    # Environment variables
    environment:
      # Service Identity
      DASHBOARD_SERVICE_NAME: data-services-dashboard
      DASHBOARD_SERVICE_VERSION: 1.0.0
      
      # Ports
      DASHBOARD_UI_PORT: 8501
      DASHBOARD_API_PORT: 8080
      
      # External Services
      DASHBOARD_LOG_COLLECTOR_URL: http://log-collector:8104
      
      # Services to Monitor
      DASHBOARD_DEFAULT_SERVICES: All,doc_store,prompt_store,external-service-store,memory-agent
      
      # Performance & Caching
      DASHBOARD_CACHE_TTL: 30
      DASHBOARD_HTTP_TIMEOUT: 5.0
      
      # Retry Logic
      DASHBOARD_MAX_RETRY_ATTEMPTS: 3
      DASHBOARD_RETRY_DELAY: 1.0
      DASHBOARD_RETRY_BACKOFF: 2.0
      
      # Environment
      DASHBOARD_ENVIRONMENT: production
      DASHBOARD_DEBUG: false
    
    # Volumes
    volumes:
      - ./logs:/app/logs  # Persist logs
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Dependencies
    depends_on:
      log-collector:
        condition: service_healthy
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Networks
    networks:
      - hackathon_default
  
  # =============================================================================
  # Log Collector Service (Required Dependency)
  # =============================================================================
  
  log-collector:
    image: log-collector:latest
    container_name: log-collector
    
    ports:
      - "8104:8104"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - hackathon_default

# =============================================================================
# Networks
# =============================================================================

networks:
  hackathon_default:
    driver: bridge
    name: hackathon_default
