services:
  data-services-dashboard:
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic && python
      services/data-services-dashboard/main.py"
    environment:
    - ENVIRONMENT=development
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8087/health
      timeout: 10s
    image: python:3.12-slim
    ports:
    - 8087:8080
    volumes:
    - ./:/app:ro
    - data-services-dashboard_code:/app:rw
    working_dir: /app
    networks:
    - hackathon_default
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

volumes:
  redis_data:
    driver: local
  data-services-dashboard_code:
    driver: local

networks:
  hackathon_default:
    driver: bridge
