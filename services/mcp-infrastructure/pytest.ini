[pytest]
# Pytest configuration for MCP Infrastructure Service

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Console output
console_output_style = progress
log_cli = false
log_cli_level = INFO

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=services/mcp_infrastructure
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require Redis, may be slow)
    asyncio: Async tests
    slow: Slow running tests

# Async support
asyncio_mode = auto

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeouts (pytest-timeout)
timeout = 30
timeout_method = thread

