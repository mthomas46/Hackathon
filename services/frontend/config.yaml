# Frontend-specific configuration
# Inherits from shared base_config.yaml

# Override server port for frontend
server:
  port: 3000

# Service URLs that frontend connects to
services:
  api_dashboard_url: ${API_DASHBOARD_URL:-http://unified-api-dashboard:8000}
  orchestrator_url: ${ORCHESTRATOR_URL:-http://orchestrator:5099}
  analysis_service_url: ${ANALYSIS_SERVICE_URL:-http://analysis-service:5020}
