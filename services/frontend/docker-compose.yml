services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
    - ./:/app:ro
    environment:
    - ENVIRONMENT=production
    - PYTHONPATH=/app
    ports:
    - 8085:3000
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

volumes:
  redis_data:
    driver: local

networks:
  hackathon_default:
    driver: bridge
