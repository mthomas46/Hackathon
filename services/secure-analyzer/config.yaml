server:
  port: 5070
policy:
  secure_only_models: ${SECURE_ONLY_MODELS:-bedrock,ollama}
  all_providers: ${ALL_PROVIDERS:-bedrock,ollama,openai,anthropic,grok}
  default_prompt: 'Summarize focusing on risks, PII, secrets, and client information.

    '
circuit_breaker:
  max_failures: ${SECURE_ANALYZER_CIRCUIT_BREAKER_MAX_FAILURES:-5}
  timeout_seconds: ${SECURE_ANALYZER_CIRCUIT_BREAKER_TIMEOUT:-60}
services:
  summarizer_hub_url: ${SUMMARIZER_HUB_URL:-http://summarizer-hub:5060}
testing: ${TESTING:-false}
security:
  enable_ssl: ${SSL_ENABLED:-false}
  ssl_cert_path: ${SSL_CERT_PATH:-}
  ssl_key_path: ${SSL_KEY_PATH:-}
  cors_origins: ${CORS_ORIGINS:-http://localhost:3000}
  rate_limiting_enabled: ${RATE_LIMITING_ENABLED:-true}
  max_request_size: ${MAX_REQUEST_SIZE:-10485760}
  timeout_seconds: ${TIMEOUT_SECONDS:-30}
  enable_request_logging: ${REQUEST_LOGGING:-false}
  enable_metrics: ${METRICS_ENABLED:-true}
development:
  debug_mode: ${DEBUG_MODE:-false}
  enable_cors: ${ENABLE_CORS:-true}
  mock_external_services: ${MOCK_EXTERNAL:-false}
  log_level: ${LOG_LEVEL:-INFO}
