services:
  bedrock-proxy:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - bedrock-proxy_code:/app:rw
    environment:
    - ENVIRONMENT=development
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic && python
      services/bedrock-proxy/main.py"
    ports:
    - 7090:7090
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:7090/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

volumes:
  redis_data:
    driver: local
  bedrock-proxy_code:
    driver: local

networks:
  hackathon_default:
    driver: bridge
