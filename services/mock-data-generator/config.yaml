# Mock Data Generator Service Configuration
# Inherits from shared base_config.yaml

# Override server port for mock-data-generator
server:
  host: ${SERVER_API_HOST:-0.0.0.0}
  port: 5065
  debug: ${DEBUG:-false}
  workers: ${SERVER_WORKERS:-1}
  timeout: ${SERVER_TIMEOUT:-30}

# Service metadata
service:
  name: "mock-data-generator"
  title: "Mock Data Generator"
  version: "1.0.0"

# LLM Gateway Integration
llm_gateway:
  url: ${LLM_GATEWAY_URL:-http://llm-gateway:5055}
  default_provider: ${DEFAULT_LLM_PROVIDER:-ollama}
  generation_timeout: ${GENERATION_TIMEOUT:-30}
  max_tokens: ${MAX_TOKENS:-2000}

# Document Store Integration
doc_store:
  url: ${DOC_STORE_URL:-http://doc_store:5087}
  auto_persist: ${AUTO_PERSIST:-true}
  retention_days: ${RETENTION_DAYS:-7}

# Generation Settings
generation:
  max_items_per_request: 50
  default_complexity: "medium"
  supported_types:
    - confluence_page
    - github_repo
    - github_pr
    - jira_issue
    - jira_epic
    - api_docs
    - code_sample

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/mock_data_generator.log"

# Health Check Configuration
health:
  check_interval: 30
  timeout: 10
  dependencies:
    - llm_gateway
    - doc_store
