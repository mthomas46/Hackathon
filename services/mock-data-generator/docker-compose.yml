services:
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
  llm-gateway:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - llm_gateway_cache:/app/cache
    environment:
    - PYTHONPATH=/app
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - OLLAMA_ENDPOINT=http://host.docker.internal:11434
    - EXTERNAL_OPENAI_API_KEY=${EXTERNAL_OPENAI_API_KEY:-}
    - EXTERNAL_ANTHROPIC_API_KEY=${EXTERNAL_ANTHROPIC_API_KEY:-}
    command: bash -c "pip install --no-cache-dir fastapi uvicorn httpx pydantic redis
      aioredis && python services/llm-gateway/main.py"
    ports:
    - 8085:5055
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5055/health
      interval: 30s
      timeout: 10s
      retries: 3
  mock-data-generator:
    build:
      context: ../..
      dockerfile: services/mock-data-generator/Dockerfile
    environment:
    - PYTHONPATH=/app
    - REDIS_API_HOST=redis
    - ENVIRONMENT=development
    - LLM_GATEWAY_URL=http://llm-gateway:5055
    - DOC_STORE_URL=http://host.docker.internal:5087
    ports:
    - 8085:5065
    depends_on:
      llm-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5065/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  redis_data:
    driver: local
  llm_gateway_cache:
    driver: local
networks:
  hackathon_default:
    name: mock-data-generator-network
    driver: bridge
