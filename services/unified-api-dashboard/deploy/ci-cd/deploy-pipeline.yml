# GitHub Actions CI/CD Pipeline for Unified API Dashboard
# Comprehensive deployment pipeline with security, testing, and production rollout

name: Deploy Unified API Dashboard

on:
  push:
    branches: [ main, production ]
    paths:
      - 'services/unified-api-dashboard/**'
  pull_request:
    branches: [ main, production ]
    paths:
      - 'services/unified-api-dashboard/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      version:
        description: 'Version to deploy'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/unified-api-dashboard
  DOCKER_BUILDKIT: 1

jobs:
  # Build and test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.EXTERNAL_GITHUB_TOKEN }}

    - name: Generate version
      id: version
      run: |
        if [ "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="$(git describe --tags --always --dirty)-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: services/unified-api-dashboard
        file: services/unified-api-dashboard/deploy/docker/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        labels: |
          org.opencontainers.image.title=Unified API Dashboard
          org.opencontainers.image.description=Enterprise API Management Platform
          org.opencontainers.image.version=${{ steps.version.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.repositoryUrl }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Run security scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        scan-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        format: spdx-json
        output-file: ./sbom.spdx.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: ./sbom.spdx.json

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.EXTERNAL_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update kube config
      run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_STAGING }}

    - name: Deploy to staging with Helm
      run: |
        cd services/unified-api-dashboard/deploy/helm

        # Update image tag in values
        sed -i "s/tag: .*/tag: \"${{ needs.build-and-test.outputs.version }}\"/" values-staging.yaml

        # Deploy with Helm
        helm upgrade --install api-dashboard-staging . \
          --namespace api-dashboard-staging \
          --create-namespace \
          --values values-staging.yaml \
          --set image.tag=${{ needs.build-and-test.outputs.version }} \
          --wait \
          --timeout 600s

    - name: Run staging tests
      run: |
        # Wait for deployment to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/api-dashboard-staging -n api-dashboard-staging

        # Run integration tests against staging
        npm test -- --environment=staging

    - name: Notify staging deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-staging]
    if: github.ref == 'refs/heads/production' || github.event.inputs.environment == 'production'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.EXTERNAL_AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: ${{ secrets.AWS_REGION_PROD }}

    - name: Update kube config
      run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_PRODUCTION }}

    - name: Deploy to production with Helm
      run: |
        cd services/unified-api-dashboard/deploy/helm

        # Update image tag in values
        sed -i "s/tag: .*/tag: \"${{ needs.build-and-test.outputs.version }}\"/" values-production.yaml

        # Deploy with Helm using blue-green strategy
        # First, deploy to blue environment
        helm upgrade --install api-dashboard-blue . \
          --namespace api-dashboard-prod \
          --values values-production.yaml \
          --set image.tag=${{ needs.build-and-test.outputs.version }} \
          --set ingress.hosts[0].host=api-dashboard-blue.your-domain.com \
          --wait \
          --timeout 900s

        # Wait for blue deployment to be ready
        kubectl wait --for=condition=available --timeout=600s deployment/api-dashboard-blue -n api-dashboard-prod

        # Run smoke tests on blue
        echo "Running smoke tests on blue environment..."
        # Add smoke test commands here

        # Switch traffic to blue (green environment)
        kubectl patch service api-dashboard-service -n api-dashboard-prod \
          -p '{"spec":{"selector":{"app.kubernetes.io/name": "api-dashboard-blue"}}}'

        # Wait for traffic to switch
        sleep 30

        # Verify production traffic
        echo "Verifying production traffic..."
        # Add verification commands here

        # Clean up old deployment (green becomes old)
        helm uninstall api-dashboard-green -n api-dashboard-prod || true

        # Rename blue to green for next deployment
        kubectl label deployment api-dashboard-blue app.kubernetes.io/name=api-dashboard-green -n api-dashboard-prod

    - name: Update production ingress
      run: |
        # Update ingress to point to new deployment
        kubectl patch ingress api-dashboard-ingress -n api-dashboard-prod \
          -p '{"spec":{"rules":[{"host":"api-dashboard.your-domain.com","http":{"paths":[{"path":"/","pathType":"Prefix","backend":{"service":{"name":"api-dashboard-service","port":{"number":80}}}}]}}]}}'

    - name: Run production health checks
      run: |
        # Comprehensive health checks
        MAX_RETRIES=30
        RETRY_COUNT=0

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -f -s http://api-dashboard.your-domain.com/health > /dev/null; then
            echo "✅ Production health check passed"
            break
          else
            echo "❌ Health check failed, retrying... ($((RETRY_COUNT+1))/$MAX_RETRIES)"
            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 10
          fi
        done

        if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
          echo "❌ Production deployment failed health checks"
          exit 1
        fi

    - name: Run production integration tests
      run: |
        # Run comprehensive integration tests against production
        npm run test:integration -- --environment=production --retries=3

    - name: Notify production deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#production-deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_PROD }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PROD }}

  # Rollback job (manual trigger)
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment: production

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.EXTERNAL_AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: ${{ secrets.AWS_REGION_PROD }}

    - name: Update kube config
      run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_PRODUCTION }}

    - name: Rollback to previous version
      run: |
        # Switch traffic back to green environment
        kubectl patch service api-dashboard-service -n api-dashboard-prod \
          -p '{"spec":{"selector":{"app.kubernetes.io/name": "api-dashboard-green"}}}'

        # Scale down blue environment
        kubectl scale deployment api-dashboard-blue -n api-dashboard-prod --replicas=0

        # Optional: redeploy previous known good version
        # helm rollback api-dashboard-green -n api-dashboard-prod

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: 'Production deployment rolled back to previous version'
        channel: '#production-deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_PROD }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PROD }}

  # Post-deployment monitoring
  monitor-deployment:
    name: Monitor Deployment
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.EXTERNAL_AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: ${{ secrets.AWS_REGION_PROD }}

    - name: Update kube config
      run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_PRODUCTION }}

    - name: Monitor deployment health
      run: |
        # Monitor for 10 minutes post-deployment
        MONITOR_DURATION=600
        CHECK_INTERVAL=30

        echo "Monitoring deployment health for $MONITOR_DURATION seconds..."

        for ((i=0; i<MONITOR_DURATION; i+=CHECK_INTERVAL)); do
          # Check pod health
          UNHEALTHY_PODS=$(kubectl get pods -n api-dashboard-prod --field-selector=status.phase!=Running -o jsonpath='{.items[*].metadata.name}')
          if [ ! -z "$UNHEALTHY_PODS" ]; then
            echo "❌ Unhealthy pods detected: $UNHEALTHY_PODS"
            exit 1
          fi

          # Check service availability
          if ! curl -f -s --max-time 5 http://api-dashboard.your-domain.com/health > /dev/null; then
            echo "❌ Service health check failed"
            exit 1
          fi

          # Check error rates (if metrics available)
          ERROR_RATE=$(curl -s http://api-dashboard.your-domain.com/metrics | grep 'http_requests_total{status=~"5.."}' | awk '{print $2}' || echo "0")
          if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
            echo "⚠️ High error rate detected: ${ERROR_RATE}"
            # Could send alert here
          fi

          echo "✅ Deployment health check passed ($((i+CHECK_INTERVAL))/$MONITOR_DURATION)"
          sleep $CHECK_INTERVAL
        done

        echo "✅ Post-deployment monitoring completed successfully"
