apiVersion: v2
name: unified-api-dashboard
description: Enterprise API Management Platform - Unified API Dashboard
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - api
  - management
  - dashboard
  - monitoring
  - analytics
  - security
home: https://github.com/unified-api/dashboard
sources:
  - https://github.com/unified-api/dashboard
maintainers:
  - name: API Team
    email: api@unified-api.local
dependencies:
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: prometheus
    version: "15.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "6.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
  - name: loki
    version: "3.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
  - name: promtail
    version: "6.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: promtail.enabled
