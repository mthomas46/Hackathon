apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unified-api-dashboard.secretName" . }}
  labels:
    {{- include "unified-api-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  {{- if .Values.secrets.auditSecret }}
  audit-secret: {{ .Values.secrets.auditSecret | b64enc }}
  {{- else }}
  audit-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc }}
  {{- else }}
  redis-password: {{ randAlphaNum 16 | b64enc }}
  {{- end }}
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc }}
  {{- else }}
  postgres-password: {{ randAlphaNum 16 | b64enc }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc }}
  {{- else }}
  database-url: {{ printf "postgresql://%s:%s@%s:%d/%s" .Values.postgresql.auth.username (randAlphaNum 16) .Values.config.postgres.host .Values.config.postgres.port .Values.config.postgres.database | b64enc }}
  {{- end }}
