apiVersion: v1
kind: Service
metadata:
  name: {{ include "unified-api-dashboard.fullname" . }}
  labels:
    {{- include "unified-api-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    {{- if .Values.config.metricsEnabled }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "unified-api-dashboard.selectorLabels" . | nindent 4 }}
