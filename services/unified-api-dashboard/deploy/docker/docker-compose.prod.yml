services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.prod
      target: production
    image: unified-api-dashboard:prod-${BUILD_TAG:-latest}
    container_name: unified-api-dashboard
    ports:
    - ${DASHBOARD_API_PORT:-8000}:8000
    environment:
    - SERVICE_NAME=unified-api-dashboard
    - SERVICE_API_PORT=8000
    - ENVIRONMENT=production
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - METRICS_ENABLED=true
    - REDIS_API_HOST=redis
    - REDIS_API_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - REDIS_DB=0
    - DISCOVERY_AGENT_URL=http://discovery-agent:8080
    - PROMETHEUS_URL=http://prometheus:9090
    - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY}
    - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8501}
    - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
    - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
    - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-50}
    - CACHE_ENABLED=true
    - CACHE_TTL=3600
    - CACHE_MAX_SIZE=1000
    - RATE_LIMIT_REQUESTS_PER_MINUTE=1000
    - RATE_LIMIT_BURST_LIMIT=50
    - ANALYTICS_ENABLED=true
    - SECURITY_MONITORING_ENABLED=true
    - AUDIT_LOGGING_ENABLED=true
    - TOPOLOGY_ANALYSIS_ENABLED=true
    volumes:
    - dashboard_logs:/app/logs
    - dashboard_cache:/app/cache
    - ./config.prod.yml:/app/config.yml:ro
    - ./ssl:/app/ssl:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
    - hackathon_frontend
    - hackathon_monitoring
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=Host(`api-dashboard.${DOMAIN:-local}`)
    - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
    - traefik.http.services.dashboard.loadbalancer.server.port=8000
    - prometheus.io/scrape=true
    - prometheus.io/port=8000
    - prometheus.io/path=/metrics
  postgres:
    image: postgres:15-alpine
    container_name: api-dashboard-postgres
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-api_dashboard}
    - POSTGRES_USER=${POSTGRES_USER:-dashboard}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./init/postgres:/docker-entrypoint-initdb.d:ro
    - postgres_logs:/var/log/postgresql
    ports:
    - ${POSTGRES_API_PORT:-5432}:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-api_dashboard}
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
    - hackathon_frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
  redis:
    image: redis:7-alpine
    container_name: api-dashboard-redis
    command: 'redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb
      --maxmemory-policy allkeys-lru --tcp-keepalive 300 --timeout 300 --requirepass
      ${REDIS_PASSWORD}

      '
    volumes:
    - redis_data:/data
    - redis_logs:/var/log/redis
    ports:
    - ${REDIS_API_PORT:-6379}:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
    - hackathon_frontend
    - hackathon_monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  discovery-agent:
    image: ${DISCOVERY_AGENT_IMAGE:-discovery-agent:latest}
    container_name: api-dashboard-discovery-agent
    environment:
    - SERVICE_API_PORT=8080
    - REDIS_API_HOST=redis
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - ENVIRONMENT=production
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
    - ${DISCOVERY_AGENT_API_PORT:-8080}:8080
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
    - hackathon_frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  prometheus:
    image: prom/prometheus:latest
    container_name: api-dashboard-prometheus
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    - prometheus_config:/etc/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --web.enable-lifecycle
    - --web.enable-admin-api
    ports:
    - ${PROMETHEUS_API_PORT:-9090}:9090
    networks:
    - hackathon_monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  grafana:
    image: grafana/grafana:latest
    container_name: api-dashboard-grafana
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    - GF_SMTP_ENABLED=true
    - GF_SMTP_API_HOST=${SMTP_API_HOST}
    - GF_SMTP_USER=${SMTP_USER}
    - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - ${GRAFANA_API_PORT:-3000}:3000
    depends_on:
    - prometheus
    networks:
    - hackathon_monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  loki:
    image: grafana/loki:latest
    container_name: api-dashboard-loki
    volumes:
    - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
    - ${LOKI_API_PORT:-3100}:3100
    networks:
    - hackathon_monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
  promtail:
    image: grafana/promtail:latest
    container_name: api-dashboard-promtail
    volumes:
    - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    - dashboard_logs:/var/log/dashboard:ro
    - postgres_logs:/var/log/postgres:ro
    - redis_logs:/var/log/redis:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
    - hackathon_monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
  openvas:
    image: mikesplain/openvas:latest
    container_name: api-dashboard-openvas
    environment:
    - OV_PASSWORD=${OPENVAS_PASSWORD:-admin}
    ports:
    - ${OPENVAS_API_PORT:-9392}:9392
    volumes:
    - openvas_data:/var/lib/openvas
    networks:
    - hackathon_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
  traefik:
    image: traefik:v3.0
    container_name: api-dashboard-traefik
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
    - 8084:80
    - 8446:443
    - 8085:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - traefik_letsencrypt:/letsencrypt
    networks:
    - hackathon_frontend
    - hackathon_monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  nginx:
    image: nginx:alpine
    container_name: api-dashboard-nginx
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
    - ./nginx/logs:/var/log/nginx
    ports:
    - 8080:80
    - 8443:443
    depends_on:
    - dashboard
    networks:
    - hackathon_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    profiles:
    - nginx-proxy
volumes:
  dashboard_logs:
    driver: local
  dashboard_cache:
    driver: local
  postgres_data:
    driver: local
  postgres_logs:
    driver: local
  redis_data:
    driver: local
  redis_logs:
    driver: local
  prometheus_data:
    driver: local
  prometheus_config:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  openvas_data:
    driver: local
  traefik_letsencrypt:
    driver: local
networks:
  hackathon_frontend:
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.0.0/16
  hackathon_monitoring:
    driver: bridge
    ipam:
      config:
      - subnet: 172.21.0.0/16
  hackathon_backend:
    driver: bridge
    ipam:
      config:
      - subnet: 172.22.0.0/16
configs:
  nginx_config:
    file: ./nginx/nginx.conf
  prometheus_config:
    file: ./monitoring/prometheus.yml
  grafana_config:
    file: ./monitoring/grafana/grafana.ini
