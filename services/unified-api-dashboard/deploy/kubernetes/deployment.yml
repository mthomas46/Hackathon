---
# Unified API Dashboard Kubernetes Deployment
# Production-ready deployment with RBAC, secrets, configmaps, and monitoring

apiVersion: v1
kind: Namespace
metadata:
  name: api-dashboard
  labels:
    name: api-dashboard
    app.kubernetes.io/name: unified-api-dashboard
    app.kubernetes.io/component: api-management
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: api-dashboard
  name: api-dashboard-sa
  labels:
    app.kubernetes.io/name: unified-api-dashboard
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: api-dashboard
  name: api-dashboard-role
  labels:
    app.kubernetes.io/name: unified-api-dashboard
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: api-dashboard
  name: api-dashboard-rolebinding
  labels:
    app.kubernetes.io/name: unified-api-dashboard
subjects:
- kind: ServiceAccount
  name: api-dashboard-sa
  namespace: api-dashboard
roleRef:
  kind: Role
  name: api-dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: api-dashboard
  name: api-dashboard-config
  labels:
    app.kubernetes.io/name: unified-api-dashboard
data:
  config.yml: |
    # Application Configuration
    service:
      name: unified-api-dashboard
      version: "1.0.0"
      port: 8000

    environment: production
    log_level: INFO
    metrics_enabled: true

    # Database Configuration
    redis:
      host: redis-service
      port: 6379
      db: 0
      ssl: false

    postgres:
      host: postgres-service
      port: 5432
      database: api_dashboard
      ssl: true

    # External Services
    discovery_agent:
      url: http://discovery-agent-service:8080

    # Performance Settings
    cache:
      enabled: true
      ttl: 3600
      max_size: 1000

    rate_limiting:
      requests_per_minute: 1000
      burst_limit: 50

    # Feature Flags
    features:
      analytics: true
      security_monitoring: true
      audit_logging: true
      topology_analysis: true
      developer_tools: true

    # Security Settings
    cors:
      origins: ["https://dashboard.your-domain.com"]
      credentials: true

    # Monitoring
    monitoring:
      prometheus_enabled: true
      metrics_path: /metrics
      health_check_path: /health
---
apiVersion: v1
kind: Secret
metadata:
  namespace: api-dashboard
  name: api-dashboard-secrets
  labels:
    app.kubernetes.io/name: unified-api-dashboard
type: Opaque
data:
  # Base64 encoded secrets - these should be generated securely
  jwt-secret: <base64-jwt-secret>
  audit-secret: <base64-audit-secret>
  redis-password: <base64-redis-password>
  postgres-password: <base64-postgres-password>
  database-url: <base64-database-url>
---
apiVersion: v1
kind: Secret
metadata:
  namespace: api-dashboard
  name: api-dashboard-tls
  labels:
    app.kubernetes.io/name: unified-api-dashboard
type: kubernetes.io/tls
data:
  tls.crt: <base64-tls-certificate>
  tls.key: <base64-tls-private-key>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: api-dashboard
  name: api-dashboard-logs
  labels:
    app.kubernetes.io/name: unified-api-dashboard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: api-dashboard
  name: api-dashboard-cache
  labels:
    app.kubernetes.io/name: unified-api-dashboard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: api-dashboard
  name: api-dashboard
  labels:
    app.kubernetes.io/name: unified-api-dashboard
    app.kubernetes.io/component: api-management
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-api-dashboard
      app.kubernetes.io/component: api-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unified-api-dashboard
        app.kubernetes.io/component: api-management
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-dashboard-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: api-dashboard
        image: your-registry/unified-api-dashboard:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 8000
          protocol: TCP
        env:
        - name: SERVICE_API_PORT
          value: "8000"
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: METRICS_ENABLED
          value: "true"
        # Database Configuration
        - name: REDIS_API_HOST
          value: "redis-service"
        - name: REDIS_API_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-dashboard-secrets
              key: redis-password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: api-dashboard-secrets
              key: database-url
        # Security Configuration
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-dashboard-secrets
              key: jwt-secret
        - name: AUDIT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-dashboard-secrets
              key: audit-secret
        # External Services
        - name: DISCOVERY_AGENT_URL
          value: "http://discovery-agent-service:8080"
        # Performance Tuning
        - name: GUNICORN_WORKERS
          value: "4"
        - name: GUNICORN_MAX_REQUESTS
          value: "1000"
        - name: GUNICORN_MAX_REQUESTS_JITTER
          value: "50"
        volumeMounts:
        - name: config
          mountPath: /app/config.yml
          subPath: config.yml
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: cache
          mountPath: /app/cache
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: api-dashboard-config
      - name: logs
        persistentVolumeClaim:
          claimName: api-dashboard-logs
      - name: cache
        persistentVolumeClaim:
          claimName: api-dashboard-cache
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - unified-api-dashboard
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "node-type"
        operator: "Equal"
        value: "api-services"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  namespace: api-dashboard
  name: api-dashboard-service
  labels:
    app.kubernetes.io/name: unified-api-dashboard
    app.kubernetes.io/component: api-management
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 8000
    protocol: TCP
  selector:
    app.kubernetes.io/name: unified-api-dashboard
    app.kubernetes.io/component: api-management
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: api-dashboard
  name: api-dashboard-ingress
  labels:
    app.kubernetes.io/name: unified-api-dashboard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api-dashboard.your-domain.com
    secretName: api-dashboard-tls
  rules:
  - host: api-dashboard.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-dashboard-service
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: api-dashboard-service
            port:
              number: 9090
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: api-dashboard
  name: api-dashboard-pdb
  labels:
    app.kubernetes.io/name: unified-api-dashboard
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-api-dashboard
      app.kubernetes.io/component: api-management
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: api-dashboard
  name: api-dashboard-hpa
  labels:
    app.kubernetes.io/name: unified-api-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-dashboard
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 1000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: api-dashboard
  name: api-dashboard-nginx-config
  labels:
    app.kubernetes.io/name: unified-api-dashboard
data:
  nginx.conf: |
    upstream api_dashboard {
        server api-dashboard-service:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api-dashboard.your-domain.com;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
        limit_req zone=api burst=50 nodelay;

        location / {
            proxy_pass http://api_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /metrics {
            proxy_pass http://api_dashboard;
            proxy_set_header Host $host;

            # Only allow internal access to metrics
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
