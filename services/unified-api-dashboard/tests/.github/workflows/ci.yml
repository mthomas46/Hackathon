"""
GitHub Actions CI/CD workflow for Unified API Dashboard testing.

Comprehensive testing pipeline with unit tests, integration tests,
security scanning, and deployment validation.
"""

name: Unified API Dashboard CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/unified-api-dashboard/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/unified-api-dashboard/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  DOCKER_BUILDKIT: 1

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('services/unified-api-dashboard/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd services/unified-api-dashboard
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-mock

    - name: Run unit tests
      run: |
        cd services/unified-api-dashboard
        python -m pytest tests/unit/ -v --cov=. --cov-report=xml --cov-report=html --junitxml=test-results-unit.xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./services/unified-api-dashboard/coverage.xml
        flags: unit-tests
        name: unit-tests-coverage

    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: services/unified-api-dashboard/test-results-unit.xml
      if: always()

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        cd services/unified-api-dashboard
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx

    - name: Run integration tests
      run: |
        cd services/unified-api-dashboard
        python -m pytest tests/integration/ -v --cov=. --cov-report=xml --cov-report=html --junitxml=test-results-integration.xml --cov-append

    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results
        path: services/unified-api-dashboard/test-results-integration.xml
      if: always()

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        cd services/unified-api-dashboard
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        cd services/unified-api-dashboard
        bandit -r . -f json -o bandit-report.json || true

    - name: Run Safety vulnerability scan
      run: |
        cd services/unified-api-dashboard
        safety check --output json > safety-report.json || true

    - name: Run security unit tests
      run: |
        cd services/unified-api-dashboard
        python -m pytest tests/unit/test_modules/test_security.py -v -k "security" --junitxml=security-test-results.xml

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          services/unified-api-dashboard/bandit-report.json
          services/unified-api-dashboard/safety-report.json
          services/unified-api-dashboard/security-test-results.xml
      if: always()

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        cd services/unified-api-dashboard
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-benchmark

    - name: Run performance tests
      run: |
        cd services/unified-api-dashboard
        python -m pytest tests/unit/test_modules/test_analytics.py -v -k "performance" --benchmark-only --benchmark-json=benchmark-results.json

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: services/unified-api-dashboard/benchmark-results.json
      if: always()

  # Docker Build Test
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/unified-api-dashboard/Dockerfile
        push: false
        tags: unified-api-dashboard:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm unified-api-dashboard:test python -c "import sys; sys.path.append('.'); from modules.security import AuthenticationManager; print('✅ Docker build successful')"

  # Compliance Tests
  compliance-tests:
    name: Compliance Tests
    runs-on: ubuntu-latest
    needs: security-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        cd services/unified-api-dashboard
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run compliance tests
      run: |
        cd services/unified-api-dashboard
        python -m pytest tests/unit/test_modules/test_security.py -v -k "compliance" --junitxml=compliance-test-results.xml

    - name: Generate compliance report
      run: |
        cd services/unified-api-dashboard
        python -c "
        from modules.security.audit import ComplianceMonitor
        from modules.security.audit import AuditLogger
        import json

        audit_logger = AuditLogger()
        compliance_monitor = ComplianceMonitor(audit_logger)
        status = compliance_monitor.get_compliance_status()

        with open('compliance-status.json', 'w') as f:
            json.dump(status, f, indent=2)
        "

    - name: Upload compliance reports
      uses: actions/upload-artifact@v3
      with:
        name: compliance-reports
        path: |
          services/unified-api-dashboard/compliance-test-results.xml
          services/unified-api-dashboard/compliance-status.json
      if: always()

  # Coverage Report
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download coverage reports
      uses: actions/download-artifact@v3
      with:
        name: unit-test-results-3.11

    - name: Generate coverage badge
      run: |
        cd services/unified-api-dashboard
        # Install coverage tools
        pip install coverage-badge

        # Generate coverage badge
        coverage-badge -o coverage-badge.svg

    - name: Upload coverage badge
      uses: actions/upload-artifact@v3
      with:
        name: coverage-badge
        path: services/unified-api-dashboard/coverage-badge.svg
      if: always()

  # Quality Gates
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-tests, performance-tests, compliance-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        # Check if all required jobs passed
        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed"
          exit 1
        fi

        if [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Integration tests failed"
          exit 1
        fi

        if [ "${{ needs.security-tests.result }}" != "success" ]; then
          echo "❌ Security tests failed"
          exit 1
        fi

        echo "✅ All quality gates passed"

    - name: Create quality report
      run: |
        cat > quality-report.md << EOF
        # Quality Gate Report

        ## Test Results
        - Unit Tests: ${{ needs.unit-tests.result }}
        - Integration Tests: ${{ needs.integration-tests.result }}
        - Security Tests: ${{ needs.security-tests.result }}
        - Performance Tests: ${{ needs.performance-tests.result }}
        - Compliance Tests: ${{ needs.compliance-tests.result }}

        ## Overall Status
        $([ "${{ needs.unit-tests.result }}" == "success" ] && \
          [ "${{ needs.integration-tests.result }}" == "success" ] && \
          [ "${{ needs.security-tests.result }}" == "success" ] && \
          echo "✅ PASSED" || echo "❌ FAILED")

        Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
        EOF

    - name: Upload quality report
      uses: actions/upload-artifact@v3
      with:
        name: quality-report
        path: quality-report.md
      if: always()

  # Deployment Validation (only on main branch)
  deploy-validation:
    name: Deployment Validation
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and validate production image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/unified-api-dashboard/Dockerfile
        push: false
        tags: unified-api-dashboard:prod-${{ github.sha }}
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Validate production readiness
      run: |
        cd services/unified-api-dashboard

        # Check for required files
        required_files=("Dockerfile" "requirements.txt" "app.py" "config.py")
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Missing required file: $file"
            exit 1
          fi
        done

        # Validate configuration
        python -c "
        from config import config
        required_attrs = ['service', 'security', 'database']
        for attr in required_attrs:
            if not hasattr(config, attr):
                print(f'❌ Missing config attribute: {attr}')
                exit(1)
        print('✅ Configuration validation passed')
        "

        # Test import of all modules
        python -c "
        try:
            from modules.security import AuthenticationManager
            from modules.analytics import UsageAnalytics
            from modules.developer_tools import ClientCodeGenerator
            from modules.topology import TopologyAnalyzer
            print('✅ All module imports successful')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

        echo "✅ Deployment validation passed"
