# Analysis-service-specific configuration
# Inherits from shared base_config.yaml

# Override server port for analysis-service
server:
  port: 5020

# Analysis-service specific settings
analysis:
  drift_overlap_threshold: ${DRIFT_OVERLAP_THRESHOLD:-0.1}
  critical_score: ${CRITICAL_SCORE:-90}
  high_priority_score: ${HIGH_PRIORITY_SCORE:-80}
  medium_priority_score: ${MEDIUM_PRIORITY_SCORE:-50}
  testing: ${TESTING:-false}

# Service URLs for analysis integrations
services:
  doc_store_url: ${DOC_STORE_URL:-http://doc_store:5087}
  source_agent_url: ${SOURCE_AGENT_URL:-http://source-agent:5000}
  prompt_store_url: ${PROMPT_STORE_URL:-http://prompt-store:5110}
  interpreter_url: ${INTERPRETER_URL:-http://interpreter:5120}
  orchestrator_url: ${ORCHESTRATOR_URL:-http://orchestrator:5099}

# Timeouts and limits (in seconds/units)
timeouts:
  service_client: ${SERVICE_CLIENT_TIMEOUT:-30}
  analysis_processing: ${ANALYSIS_PROCESSING_TIMEOUT:-300}
  workflow_processing: ${WORKFLOW_PROCESSING_TIMEOUT:-120}
  findings_retrieval: ${FINDINGS_RETRIEVAL_TIMEOUT:-60}

limits:
  max_lines_added_threshold: ${MAX_LINES_ADDED_THRESHOLD:-1000}
  quality_score_weight: ${QUALITY_SCORE_WEIGHT:-30}
  max_document_id_length: ${MAX_DOCUMENT_ID_LENGTH:-500}
