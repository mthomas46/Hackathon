services:
  architecture-digitizer:
    build:
      context: ../../
      dockerfile: services/architecture-digitizer/Dockerfile
    volumes:
    - ./:/app:ro
    - architecture-digitizer_code:/app:rw
    environment:
    - ENVIRONMENT=development
    ports:
    - 8085:5105
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5105/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hackathon_default

volumes:
  redis_data:
    driver: local
  architecture-digitizer_code:
    driver: local

networks:
  hackathon_default:
    driver: bridge
