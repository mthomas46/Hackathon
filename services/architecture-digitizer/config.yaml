server:
  port: 5105
architecture_digitizer:
  supported_systems:
  - miro
  - figjam
  - lucid
  - confluence
  api_timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 1
  rate_limit_requests_per_minute: 60
  default_component_type: service
  cache_enabled: true
  cache_ttl_seconds: 300
external_apis:
  miro:
    base_url: https://api.miro.com/v2
    token_env_var: MIRO_TOKEN
  figjam:
    base_url: https://api.figma.com/v1
    token_env_var: FIGMA_TOKEN
  lucid:
    base_url: https://lucid.app/api
    token_env_var: LUCID_TOKEN
  confluence:
    base_url_template: https://{domain}.atlassian.net/wiki/rest/api
    token_env_var: CONFLUENCE_TOKEN
security:
  enable_ssl: ${SSL_ENABLED:-false}
  ssl_cert_path: ${SSL_CERT_PATH:-}
  ssl_key_path: ${SSL_KEY_PATH:-}
  cors_origins: ${CORS_ORIGINS:-http://localhost:3000}
  rate_limiting_enabled: ${RATE_LIMITING_ENABLED:-true}
  max_request_size: ${MAX_REQUEST_SIZE:-10485760}
  timeout_seconds: ${TIMEOUT_SECONDS:-30}
  enable_request_logging: ${REQUEST_LOGGING:-false}
  enable_metrics: ${METRICS_ENABLED:-true}
development:
  debug_mode: ${DEBUG_MODE:-false}
  enable_cors: ${ENABLE_CORS:-true}
  mock_external_services: ${MOCK_EXTERNAL:-false}
  log_level: ${LOG_LEVEL:-INFO}
