services:
  redis:
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic && python
      services/redis/main.py"
    environment:
    - ENVIRONMENT=development
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/health
      timeout: 10s
    image: python:3.12-slim
    ports:
    - 8081:8080
    volumes:
    - ./:/app:ro
    - redis_code:/app:rw
    working_dir: /app
    networks:
    - hackathon_default
volumes:
  redis_code:
    driver: local
networks:
  hackathon_default:
    driver: bridge
