version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecosystem-mcp-postgres
    environment:
      POSTGRES_DB: ecosystem_mcp
      POSTGRES_USER: ecosystem
      POSTGRES_PASSWORD: ecosystem_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosystem"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecosystem-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis (Queue & Cache)
  redis:
    image: redis:7-alpine
    container_name: ecosystem-mcp-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecosystem-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: ecosystem-mcp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # ⚡ Performance Optimizations
      - OLLAMA_NUM_CTX=2048           # Reduce context window (was 4096)
      - OLLAMA_NUM_THREADS=10         # Use 10 threads for M4 Max
      - OLLAMA_NUM_BATCH=2048         # Increase batch size (was 512)
      - OLLAMA_KEEP_ALIVE=10m         # Keep models loaded for 10 minutes
      - OLLAMA_FLASH_ATTENTION=1      # Enable flash attention
      - OLLAMA_MAX_QUEUE=10           # Allow queue of 10 requests
      - OLLAMA_NUM_PARALLEL=2         # Process 2 requests in parallel
      - OLLAMA_LLM_LIBRARY=cpu_arm64  # Optimize for Apple Silicon
    mem_limit: 30g  # 30GB for multiple LLaMA models
    mem_reservation: 8g  # Reserve 8GB minimum
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s  # Give Ollama 2 minutes to start
    networks:
      - ecosystem-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # Uncomment for NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # NEW: Embedding Service (FastEmbed + ONNX)
  embedding-service:
    build:
      context: ../ecosystem-mcp-embedding
      dockerfile: Dockerfile
    container_name: ecosystem-mcp-embedding
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_NAME: "BAAI/bge-base-en-v1.5"  # 768 dims (matches nomic-embed-text)
      CACHE_TTL: 2592000  # 30 days
      CACHE_ENABLED: "true"
      LOG_LEVEL: INFO
    ports:
      - "8001:8000"  # Embedding API
    volumes:
      - ./data/embedding_models:/app/models  # Model cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Model loading time
    networks:
      - ecosystem-mcp
    restart: unless-stopped
    mem_limit: 4g  # Dedicated memory for embeddings
    mem_reservation: 2g
    # Optional: Dedicate CPU cores for better isolation
    # cpuset_cpus: "0-3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ecosystem MCP Service (API)
  ecosystem-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecosystem-mcp-service
    # Allow access to Docker socket
    user: root  # Run as root to access Docker socket
    environment:
      DATABASE_URL: postgresql://ecosystem:ecosystem_password@postgres:5432/ecosystem_mcp
      REDIS_URL: redis://redis:6379/0
      CHROMA_PATH: /app/data/chroma_db
      OLLAMA_BASE_URL: http://ollama:11434
      # NEW: Embedding service URL
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_BACKEND: "service"  # Use embedding service instead of Ollama
      MODEL_STRATEGY: ollama-only
      # Performance settings
      ENABLE_CACHE: "true"
      CACHE_TTL: 3600
      RATE_LIMIT_ENABLED: "true"  # ⚡ QUICK WIN #10: Enable rate limiting
      RATE_LIMIT_REQUESTS: 100  # 100 requests
      RATE_LIMIT_WINDOW: 60  # per minute
      # Preflight settings
      PREFLIGHT_MODE: "lenient"  # Allow startup even if Ollama is slow
      # Desktop Ollama (Tier 2) - GPU Enhanced
      OLLAMA_DESKTOP_ENABLED: "true"
      OLLAMA_DESKTOP_URL: http://host.docker.internal:11434
      OLLAMA_DESKTOP_MODEL: llama3:latest
      USE_DESKTOP_FOR_RAG: "true"
      # Cursor IDE (Tier 1) - Premium Models
      CURSOR_ENABLED: "true"
      CURSOR_MCP_URL: http://host.docker.internal:3000
      CURSOR_MODEL: claude-4.5-sonnet
    ports:
      - "8000:8000"  # API
      - "9090:9090"  # Metrics
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/backups:/app/data/backups
      - /Users/mykalthomas/Documents/work:/work:ro  # Mount entire work directory - access ALL projects
      - /Users/mykalthomas/Documents/work/Hackathon/.rag-config:/app/.rag-config:ro  # RAG enhancements config
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for container management
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy  # Wait for embedding service
      ollama:
        condition: service_started  # Don't wait for healthy, just started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s  # Give API 90 seconds to start
    networks:
      - ecosystem-mcp
    restart: unless-stopped
    # ⚡ QUICK WIN #9: Resource limits to prevent exhaustion
    deploy:
      resources:
        limits:
          cpus: '4.0'  # 4 CPU cores max
          memory: 8G  # 8GB RAM max
        reservations:
          cpus: '2.0'  # Reserve 2 cores
          memory: 4G  # Reserve 4GB
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Ecosystem MCP Dashboard
  dashboard:
    build:
      context: ../ecosystem-mcp-dashboard
      dockerfile: Dockerfile
    container_name: ecosystem-mcp-dashboard
    environment:
      # 🔧 FIXED: Use service name instead of host.docker.internal
      - API_BASE_URL=http://ecosystem-mcp:8000
    ports:
      - "8501:8501"
    volumes:
      # Mount local code for hot-reload during development
      - ../ecosystem-mcp-dashboard/pages:/app/pages
      - ../ecosystem-mcp-dashboard/utils:/app/utils
      - ../ecosystem-mcp-dashboard/dashboard_views:/app/dashboard_views
      - ../ecosystem-mcp-dashboard/app.py:/app/app.py
    depends_on:
      ecosystem-mcp:
        condition: service_healthy  # Wait for API to be healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Give Streamlit time to start
    networks:
      - ecosystem-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  ecosystem-mcp:
    name: ecosystem-mcp
    driver: bridge

