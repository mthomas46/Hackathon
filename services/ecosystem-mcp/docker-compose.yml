version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecosystem-mcp-postgres
    environment:
      POSTGRES_DB: ecosystem_mcp
      POSTGRES_USER: ecosystem
      POSTGRES_PASSWORD: ecosystem_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosystem"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecosystem-mcp

  # Redis (Queue & Cache)
  redis:
    image: redis:7-alpine
    container_name: ecosystem-mcp-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecosystem-mcp

