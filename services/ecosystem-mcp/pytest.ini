[pytest]
# Pytest configuration for Ecosystem MCP Service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for different test types
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require dependencies)
    e2e: End-to-end tests (full system)
    smoke: Smoke tests (quick validation of major workflows)
    slow: Slow tests (> 1 second)
    requires_ollama: Tests that require Ollama to be running
    requires_db: Tests that require PostgreSQL
    requires_redis: Tests that require Redis

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70

# Async support
asyncio_mode = auto

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

