[pytest]
# Pytest configuration for Adaptive Documentation System tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    functional: Functional tests for API endpoints
    e2e: End-to-end workflow tests
    slow: Slow-running tests (performance, load)
    benchmark: Performance benchmark tests
    smoke: Quick smoke tests for basic functionality

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --cov=src
    --cov-report=html:coverage_report
    --cov-report=term-missing
    --maxfail=5

# Asyncio mode
asyncio_mode = auto

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
