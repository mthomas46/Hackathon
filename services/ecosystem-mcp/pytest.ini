[pytest]
# PyTest Configuration for Timeline Analysis Tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require services)
    e2e: End-to-end tests (full workflows)
    smoke: Smoke tests (basic functionality)
    functional: Functional tests (real database workflows)
    slow: Slow tests (may take >1s)
    acceptance: Acceptance tests (user scenarios)
    concurrent: Concurrent tests (parallel execution)
    requires_docker: Tests requiring Docker services
    edge_cases: Edge case tests

# Test paths
testpaths = tests

# Coverage configuration (disabled by default for speed, enable with --cov)
# Parallel execution disabled by default (enable with -n auto)
addopts =
    --verbose
    --strict-markers
    --tb=short
    --maxfail=5

# Async configuration
asyncio_mode = auto

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Performance optimization
# Use pytest-xdist for parallel execution
# -n auto: Use all available CPU cores
# --dist loadscope: Distribute tests by module/class for better isolation
