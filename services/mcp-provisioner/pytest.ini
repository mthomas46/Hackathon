[pytest]
# Pytest configuration for MCP Provisioner Service

pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Coverage
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=services/mcp_provisioner
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=85

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    docker: Tests requiring Docker

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

