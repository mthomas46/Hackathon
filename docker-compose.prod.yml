services:
  nginx:
    image: nginx:alpine
    ports:
    - 8083:80
    - 8445:443
    volumes:
    - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./infrastructure/ssl:/etc/nginx/ssl:ro
    depends_on:
      orchestrator:
        condition: service_started
      frontend:
        condition: service_started
      doc_store:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - nginx
      - -t
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
    - redis_data:/data
    networks:
    - hackathon_backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doc_consistency}
      POSTGRES_USER: ${POSTGRES_USER:-doc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infrastructure/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
    - hackathon_backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-doc_user} -d ${POSTGRES_DB:-doc_consistency}
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  orchestrator:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/orchestrator/config.yaml:/app/services/orchestrator/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - REDIS_API_HOST=redis
    - ENVIRONMENT=production
    - USE_POSTGRESQL=true
    - LOG_LEVEL=WARNING
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn httpx pydantic redis
      aioredis psycopg2-binary && python services/orchestrator/main.py"
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5099/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  doc_store:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/doc_store/config.yaml:/app/services/doc_store/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - REDIS_API_HOST=redis
    - ENVIRONMENT=production
    - USE_POSTGRESQL=true
    - LOG_LEVEL=WARNING
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic redis psycopg2-binary
      && python services/doc_store/main.py"
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5087/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  analysis-service:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/analysis-service/config.yaml:/app/services/analysis-service/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - REDIS_API_HOST=redis
    - ENVIRONMENT=production
    - LOG_LEVEL=WARNING
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic httpx redis
      && python services/analysis-service/main.py"
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
      doc_store:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5020/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  source-agent:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/source-agent/config.yaml:/app/services/source-agent/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - REDIS_API_HOST=redis
    - ENVIRONMENT=production
    - LOG_LEVEL=WARNING
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic httpx redis
      && python services/source-agent/main.py"
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5000/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  frontend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/frontend/config.yaml:/app/services/frontend/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - ENVIRONMENT=production
    - LOG_LEVEL=WARNING
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn httpx pydantic &&
      python services/frontend/main.py"
    networks:
    - hackathon_backend
    depends_on:
      orchestrator:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  notification-service:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/notification-service/config.yaml:/app/services/notification-service/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
