    command: bash -lc "pip install --no-cache-dir fastapi uvicorn httpx pydantic &&
      python services/secure-analyzer/main.py"
    networks:
    - hackathon_backend
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5070/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
    - redis
  code-analyzer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/code-analyzer/config.yaml:/app/services/code-analyzer/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
    - ENVIRONMENT=production
    - LOG_LEVEL=WARNING
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic redis httpx
      && python services/code-analyzer/main.py"
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5085/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  log-collector:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/log-collector/config.yaml:/app/services/log-collector/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
