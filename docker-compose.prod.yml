    - LOG_LEVEL=WARNING
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic && python
      services/notification-service/main.py"
    networks:
    - hackathon_backend
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5095/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
    - redis
  secure-analyzer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./:/app:ro
    - ./config.yml:/app/config.yml:ro
    - ./services/secure-analyzer/config.yaml:/app/services/secure-analyzer/config.yaml:ro
    - ./services/shared/config.yaml:/app/services/shared/config.yaml:ro
    environment:
