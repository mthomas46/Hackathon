# 🚀 Audit Framework CI/CD Configuration
# Comprehensive quality gates and audit settings for CI/CD pipeline

version: "1.0"
description: "Enterprise-grade audit configuration for LLM Documentation Ecosystem"

# ========================================
# 🎯 QUALITY GATES CONFIGURATION
# ========================================

quality_gates:
  # Minimum acceptable scores (0-100 scale)
  minimum_scores:
    overall: 60.0      # Grade C minimum
    architecture: 70.0
    code_quality: 55.0
    performance: 65.0
    maintainability: 60.0

  # Critical issue thresholds
  critical_issues:
    max_total: 5        # Maximum critical issues across all services
    max_per_service: 2  # Maximum critical issues per individual service

  # Service compliance requirements
  service_requirements:
    min_passing_services: 3    # Minimum number of services that must pass
    total_services: 5          # Total number of services being audited

  # Grade requirements (A=90+, B=80+, C=70+, D=60+, F<60)
  grade_requirements:
    minimum_grade: "C"         # Minimum acceptable grade
    target_grade: "B"          # Target grade for optimal performance

# ========================================
# 🔧 AUDIT PROFILE CONFIGURATION
# ========================================

audit_profiles:
  # CI/CD optimized profiles
  ci_fast:
    name: "CI Fast"
    description: "Quick CI checks with 60-second timeout"
    timeout_seconds: 60
    analysis_depth: "basic"
    parallel_execution: false
    output_format: "json"

  ci_comprehensive:
    name: "CI Comprehensive"
    description: "Full analysis for releases and major changes"
    timeout_seconds: 300
    analysis_depth: "full"
    parallel_execution: true
    output_format: "full"

  # Development profiles
  relaxed:
    name: "Relaxed"
    description: "Development-friendly with minimal requirements"
    timeout_seconds: 120
    analysis_depth: "standard"
    parallel_execution: false
    output_format: "rich"

  standard:
    name: "Standard"
    description: "Balanced analysis for regular development"
    timeout_seconds: 180
    analysis_depth: "standard"
    parallel_execution: true
    output_format: "rich"

  strict:
    name: "Strict"
    description: "Maximum scrutiny for production code"
    timeout_seconds: 300
    analysis_depth: "full"
    parallel_execution: true
    output_format: "full"

# ========================================
# 📊 SERVICE AUDIT CONFIGURATION
# ========================================

services:
  shared:
    name: "Shared Service"
    path: "services/shared"
    type: "utility"
    critical_components: ["error_handling", "logging", "configuration"]
    exclude_patterns: ["__pycache__", "*.pyc", ".git"]

  doc_store:
    name: "Document Store"
    path: "services/doc_store"
    type: "data"
    critical_components: ["database", "api", "validation"]
    exclude_patterns: ["__pycache__", "*.pyc", ".git", "migrations"]

  discovery_agent:
    name: "Discovery Agent"
    path: "services/discovery-agent"
    type: "service_discovery"
    critical_components: ["api", "health_checks", "monitoring"]
    exclude_patterns: ["__pycache__", "*.pyc", ".git"]

  analysis_service:
    name: "Analysis Service"
    path: "services/analysis-service"
    type: "business_logic"
    critical_components: ["api", "processing", "validation"]
    exclude_patterns: ["__pycache__", "*.pyc", ".git", "temp"]

  orchestrator:
    name: "Orchestrator"
    path: "services/orchestrator"
    type: "coordination"
    critical_components: ["api", "workflow", "monitoring"]
    exclude_patterns: ["__pycache__", "*.pyc", ".git"]

# ========================================
# 🔍 ANALYSIS CONFIGURATION
# ========================================

analysis:
  # Architecture analysis settings
  architecture:
    ddd_patterns:
      - "domain/"
      - "application/"
      - "infrastructure/"
      - "presentation/"
    rest_patterns:
      - "@app\.(get|post|put|delete|patch)"
      - "@router\.(get|post|put|delete|patch)"
    exclude_files:
      - "test_*.py"
      - "*_test.py"
      - "conftest.py"

  # Code quality analysis settings
  code_quality:
    complexity_thresholds:
      function: 10
      class: 50
      module: 100
    coverage_requirements:
      minimum: 70.0
      target: 85.0
    security_patterns:
      - "eval("
      - "exec("
      - "subprocess\..*shell.*=.*True"
      - "pickle\.loads"
    exclude_patterns:
      - "test_*.py"
      - "*_test.py"
      - "conftest.py"
      - "migrations/"

  # Performance analysis settings
  performance:
    resource_limits:
      cpu_percent: 80.0
      memory_percent: 85.0
    timeout_seconds: 30
    exclude_patterns:
      - "test_*.py"
      - "*_test.py"

  # Maintainability analysis settings
  maintainability:
    documentation_requirements:
      docstring_coverage: 70.0
      function_docstrings: 80.0
    error_handling_patterns:
      - "try:"
      - "except"
      - "logger\."
    exclude_patterns:
      - "test_*.py"
      - "*_test.py"
      - "__init__.py"

# ========================================
# 📋 REAPI_PORTING CONFIGURATION
# ========================================

reporting:
  # Output formats
  formats:
    - "rich"      # Interactive console output
    - "json"      # Structured data for CI/CD
    - "markdown"  # Comprehensive reports
    - "full"      # Complete analysis data

  # Artifact configuration
  artifacts:
    audit_results: "audit-results"
    quality_reports: "quality-reports"
    retention_days: 30

  # Notification settings
  notifications:
    slack_webhook: "${SLACK_WEBHOOK_URL}"
    email_recipients: ["devops@company.com"]
    failure_notifications: true
    success_notifications: false

# ========================================
# 🔧 CI/CD INTEGRATION SETTINGS
# ========================================

cicd:
  # GitHub Actions configuration
  github_actions:
    checkout_version: "v4"
    python_setup_version: "v4"
    upload_artifact_version: "v3"
    download_artifact_version: "v3"

  # Docker configuration
  docker:
    audit_image: "python:3.13-slim"
    working_directory: "/app"
    cache_directories:
      - "~/.cache/pip"
      - "~/.cache/pre-commit"

  # Pre-commit configuration
  pre_commit:
    enabled: true
    hooks:
      - "audit-framework-check"
      - "quality-gate-check"

  # Quality gate enforcement
  quality_enforcement:
    block_on_failure: true
    require_pr_approval: true
    auto_fix_attempts: 3

# ========================================
# 🚨 EMERGENCY OVERRIDE SETTINGS
# ========================================

emergency:
  # Emergency override conditions
  override_conditions:
    - "hotfix"
    - "security-patch"
    - "infrastructure-failure"

  # Override permissions
  override_permissions:
    allowed_roles: ["maintainer", "admin"]
    require_approval: true
    max_override_duration: "24h"

  # Fallback behavior
  fallback_behavior:
    minimum_checks: ["syntax", "imports"]
    skip_complex_analysis: true
    reduced_timeout: 30
