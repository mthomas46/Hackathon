services:
  redis:
    container_name: hackathon-redis-1
    build: ./services/redis
    networks:
    - hackathon_default
    ports:
    - 6379:6379
    environment: {}
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - core
    - development
    - production
    restart: unless-stopped
  doc_store:
    container_name: hackathon-doc_store-1
    build: ./services/doc_store
    networks:
    - hackathon_default
    ports:
    - 8085:5010
    environment:
      SERVICE_API_PORT: '5010'
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5010/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - core
    - development
    - production
    restart: unless-stopped
    depends_on:
    - redis
    - postgres
  orchestrator:
    container_name: hackathon-orchestrator-1
    build: ./services/orchestrator
    networks:
    - hackathon_default
    ports:
    - 8085:5099
    environment:
      SERVICE_API_PORT: '5099'
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5099/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - core
    - development
    - production
    restart: unless-stopped
    depends_on:
    - redis
  llm-gateway:
    container_name: hackathon-llm-gateway-1
    build: ./services/llm-gateway
    networks:
    - hackathon_default
    ports:
    - 8085:5055
    environment:
      SERVICE_API_PORT: '5055'
      OLLAMA_ENDPOINT: http://ollama:11434
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5055/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - ai_services
    - development
    - production
    restart: unless-stopped
    depends_on:
    - ollama
    - redis
  analysis-service:
    container_name: hackathon-analysis-service-1
    build: ./services/analysis-service
    networks:
    - hackathon_default
    ports:
    - 8085:5020
    environment:
      SERVICE_API_PORT: '5020'
      DOC_STORE_URL: http://doc_store:5010
      LLM_GATEWAY_URL: http://llm-gateway:5055
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5020/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - ai_services
    - development
    - production
    restart: unless-stopped
    depends_on:
    - doc_store
    - llm-gateway
    - redis
  discovery-agent:
    container_name: hackathon-discovery-agent-1
    build: ./services/discovery-agent
    networks:
    - hackathon_default
    ports:
    - 8085:5045
    environment:
      SERVICE_API_PORT: '5045'
      ORCHESTRATOR_URL: http://orchestrator:5099
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5045/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - ai_services
    - development
    - production
    restart: unless-stopped
    depends_on:
    - orchestrator
    - redis
  notification-service:
    container_name: hackathon-notification-service-1
    build: ./services/notification-service
    networks:
    - hackathon_default
    ports:
    - 8085:5020
    environment:
      SERVICE_API_PORT: '5020'
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5020/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - core
    - development
    - production
    restart: unless-stopped
    depends_on:
    - redis
  code-analyzer:
    container_name: hackathon-code-analyzer-1
    build: ./services/code-analyzer
    networks:
    - hackathon_default
    ports:
    - 8085:5025
    environment:
      SERVICE_API_PORT: '5025'
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5025/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - ai_services
    - development
    restart: unless-stopped
    depends_on:
    - redis
  source-agent:
    container_name: hackathon-source-agent-1
    build: ./services/source-agent
    networks:
    - hackathon_default
    ports:
    - 8085:5070
    environment:
      SERVICE_API_PORT: '5070'
      DOC_STORE_URL: http://doc_store:5010
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5070/health
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - ai_services
    - development
    restart: unless-stopped
    depends_on:
    - doc_store
    - redis
  frontend:
    container_name: hackathon-frontend-1
    build: ./services/frontend
    networks:
    - hackathon_default
    ports:
    - 8085:3000
    environment:
      REACT_APP_API_URL: http://localhost:5099
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
    - development
    - production
    restart: unless-stopped
    depends_on:
    - orchestrator
    - unified-api-dashboard
  ollama:
    container_name: hackathon-ollama-1
    build: ./services/ollama
    networks:
    - hackathon_default
    ports:
    - 8085:11434
    environment: {}
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:11434/api/tags
      interval: 60s
      timeout: 30s
      retries: 3
    profiles:
    - ai_services
    - development
    - production
    restart: unless-stopped
    depends_on:
    - redis
networks:
  hackathon_default:
    driver: bridge
profiles: {}
