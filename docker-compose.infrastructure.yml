services:
  nginx:
    image: nginx:alpine
    ports:
    - 8080:80
    - 8443:443
    volumes:
    - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./infrastructure/ssl:/etc/nginx/ssl:ro
    depends_on:
      orchestrator:
        condition: service_healthy
      doc_store:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
    - hackathon_backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - nginx
      - -t
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
    - redis_data:/data
    - ./infrastructure/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
    - 6379:6379
    networks:
    - hackathon_backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      PYTHONPATH: /svc
      POSTGRES_DB: doc_consistency
      POSTGRES_USER: doc_user
      POSTGRES_PASSWORD: doc_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"


    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
    - 5432:5432
    networks:
    - hackathon_backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U doc_user -d doc_consistency
      interval: 30s
      timeout: 10s
      retries: 3

  orchestrator:
    image: python:3.12-slim
    working_dir: /svc
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic httpx redis aioredis && uvicorn main:app --host 0.0.0.0 --port 5099"
    environment:
      PYTHONPATH: /svc
      REDIS_API_HOST: redis
      POSTGRES_API_HOST: postgres
      POSTGRES_DB: doc_consistency
      POSTGRES_USER: doc_user
      POSTGRES_PASSWORD: doc_password
    volumes:
    - ./services/orchestrator:/svc
    - ./services/shared:/svc/shared
    ports:
    - 8085:5099
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5099/health
      interval: 30s
      timeout: 10s
      retries: 3

  doc_store:
    image: python:3.12-slim
    working_dir: /svc
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic httpx redis aioredis psycopg2-binary && uvicorn main:app --host 0.0.0.0 --port 5040"
    environment:
      PYTHONPATH: /svc
      POSTGRES_DB: doc_consistency
      POSTGRES_USER: doc_user
      POSTGRES_PASSWORD: doc_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"


      REDIS_API_HOST: redis
      POSTGRES_API_HOST: postgres
      POSTGRES_DB: doc_consistency
      POSTGRES_USER: doc_user
      POSTGRES_PASSWORD: doc_password
    volumes:
    - ./services/doc_store:/svc
    - ./services/shared:/svc/shared
    ports:
    - 8086:5040
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5040/health
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: python:3.12-slim
    working_dir: /svc
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn pydantic httpx redis && python services/frontend/main.py"
    environment:
      PYTHONPATH: /svc
      POSTGRES_DB: doc_consistency
      POSTGRES_USER: doc_user
      POSTGRES_PASSWORD: doc_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"


      REDIS_API_HOST: redis
    volumes:
    - ./services/frontend:/svc
    - ./services/shared:/svc/shared
    ports:
    - 8087:8000
    networks:
    - hackathon_backend
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  hackathon_backend:
    name: hackathon-infrastructure-backend
    driver: bridge
  hackathon_default:
    name: hackathon-infrastructure-default
    driver: bridge
