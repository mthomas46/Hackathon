# RAG Enhancement Configuration
# All features are optional - delete this file to use standard behavior

# Feature flags (enable/disable individual features)
features_enabled:
  glossary: true          # Boost documents mentioning domain terms
  exclusions: true        # Filter out noise (logs, tests, etc.)
  templates: false        # Pre-optimized query structures (Phase 3)
  priorities: false       # User-defined priority documents (Phase 3)
  feedback: false         # Learn from user feedback (Phase 3)

# Signal weights (must sum to 1.0)
# Controls how different signals contribute to document ranking
signal_weights:
  semantic: 0.40        # Core semantic similarity (always active)
  glossary: 0.15        # Domain term relevance
  priority: 0.15        # User-defined priorities (future)
  content_quality: 0.15 # Document quality metrics
  recency: 0.15         # Freshness (when git history available)

# Load additional config files
glossary_file: "glossary.yaml"
exclusions_file: "exclusions.yaml"

# Notes:
# - Changes take effect within 5 minutes (cache TTL)
# - Call POST /admin/invalidate-rag-config-cache for immediate reload
# - Use API flag: {"use_enhancements": true} to enable features

