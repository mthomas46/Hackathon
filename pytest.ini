[pytest]
# Pytest configuration for Workflow F testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for different test types
markers =
    unit: Unit tests (isolated, fast)
    integration: Integration tests (require services)
    functional: Functional/end-to-end tests (slow)
    e2e: End-to-end tests (full system validation)
    slow: Slow tests
    workflow_f: Workflow F specific tests
    diagnostic: Diagnostic tests (issue investigation and validation)
    performance: Performance benchmark tests (Option C Phase 1)
    benchmark: Benchmark tests for baseline metrics
    smoke: Smoke tests for quick validation
    acceptance: Acceptance tests (user acceptance testing)
    concurrent: Concurrent operation tests (parallel execution)
    requires_docker: Tests that require Docker containers
    edge_cases: Edge case tests (boundary conditions and unusual inputs)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    # --cov=services/project_planning_service/domain/services
    # --cov-report=html
    # --cov-report=term-missing

# Ignore patterns
norecursedirs = .git .tox dist build *.egg venv* __pycache__ node_modules

# Console output verbosity
console_output_style = progress

# Log options
log_cli = false
log_cli_level = INFO

