version: '3.8'

# MCP Workflow Ecosystem - Complete Docker Compose
# All services integrated with mcp-logs for observability
# Connected via ams network for inter-service communication

networks:
  ams:
    driver: bridge
    name: ams

services:
  # ========================================
  # Infrastructure Services
  # ========================================
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - ams
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ams

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ams
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ams
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========================================
  # MCP Workflow Services
  # ========================================

  mcp-logs:
    build:
      context: ./services/mcp-logs
      dockerfile: Dockerfile
    container_name: mcp-logs
    ports:
      - "8016:8016"
    environment:
      - SERVICE_NAME=mcp-logs
      - SERVICE_PORT=8016
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LOG_LEVEL=INFO
    depends_on:
      - elasticsearch
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8016/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka-ingestion-service:
    build:
      context: ./services/kafka-ingestion-service
      dockerfile: Dockerfile
    container_name: kafka-ingestion-service
    ports:
      - "5700:5700"
    environment:
      - KAFKA_INGESTION_SERVICE_PORT=5700
      - KAFKA_INGESTION_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_INGESTION_REDIS_URL=redis://redis:6379
      - KAFKA_INGESTION_DOC_STORE_URL=http://doc_store:5087
      - KAFKA_INGESTION_MCP_LOGS_URL=http://mcp-logs:8016
      - KAFKA_INGESTION_LOG_LEVEL=INFO
    depends_on:
      - kafka
      - redis
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  llm-tagging-pipeline:
    build:
      context: ./services/llm-tagging-pipeline
      dockerfile: Dockerfile
    container_name: llm-tagging-pipeline
    ports:
      - "8022:8021"
    environment:
      - SERVICE_PORT=8021
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - DEFAULT_MODEL=llama2
      - LOG_LEVEL=INFO
    depends_on:
      - ollama
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-local-llm:
    build:
      context: ./services/mcp_local_llm
      dockerfile: Dockerfile
    container_name: mcp-local-llm
    ports:
      - "8014:8014"
    environment:
      - LOCAL_LLM_SERVICE_NAME=mcp-local-llm
      - LOCAL_LLM_PORT=8014
      - LOCAL_LLM_OLLAMA_HOST=ollama
      - LOCAL_LLM_OLLAMA_PORT=11434
      - LOCAL_LLM_DEFAULT_MODEL=llama2
    depends_on:
      - ollama
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-package-manager:
    build:
      context: ./services/mcp-package-manager
      dockerfile: Dockerfile
    container_name: mcp-package-manager
    ports:
      - "8103:8103"
    environment:
      - SERVICE_NAME=mcp-package-manager
      - SERVICE_PORT=8103
      - STORAGE_DIR=/data/packages
      - REDIS_URL=redis://redis:6379
    volumes:
      - package-data:/data/packages
    depends_on:
      - redis
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-evergreen-docs:
    build:
      context: ./services/mcp-evergreen-docs
      dockerfile: Dockerfile
    container_name: mcp-evergreen-docs
    ports:
      - "8104:8104"
    environment:
      - SERVICE_NAME=mcp-evergreen-docs
      - SERVICE_PORT=8104
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================================
  # MCP Lifecycle Services
  # ========================================

  mcp-provisioner:
    build:
      context: .
      dockerfile: ./services/mcp-provisioner/Dockerfile
    container_name: mcp-provisioner
    ports:
      - "5400:5400"
    environment:
      - SERVICE_NAME=mcp-provisioner
      - SERVICE_API_PORT=5400
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_NETWORK=ams
      - LOG_LEVEL=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    depends_on:
      - redis
      - mcp-logs
    networks:
      - ams
    user: root  # Required for Docker socket access
    privileged: true  # Required to manage Docker containers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5400/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-training-coordinator:
    build:
      context: .
      dockerfile: ./services/mcp-training-coordinator/Dockerfile
    container_name: mcp-training-coordinator
    ports:
      - "5600:5600"
    environment:
      - SERVICE_NAME=training-coordinator
      - SERVICE_API_PORT=5600
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/8
      - CELERY_RESULT_BACKEND=redis://redis:6379/8
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5600/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-store:
    build:
      context: ./services/mcp-store
      dockerfile: Dockerfile
    container_name: mcp-store
    ports:
      - "8101:8101"
    environment:
      - SERVICE_NAME=mcp-store
      - SERVICE_PORT=8101
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_BACKEND=local
      - STORAGE_DIR=/data/mcps
      - LOG_LEVEL=INFO
    volumes:
      - mcp-store-data:/data/mcps
    depends_on:
      - redis
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-registry:
    build:
      context: .
      dockerfile: ./services/mcp-registry/Dockerfile
    container_name: mcp-registry
    ports:
      - "8102:8102"
    environment:
      - SERVICE_NAME=mcp-registry
      - SERVICE_API_PORT=8102
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-gateway:
    build:
      context: .
      dockerfile: ./services/mcp-gateway/Dockerfile
    container_name: mcp-gateway
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=mcp-gateway
      - SERVICE_API_PORT=8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - mcp-logs
      - mcp-registry
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  doc_store:
    build:
      context: .
      dockerfile: ./services/doc_store/Dockerfile
    container_name: doc_store
    ports:
      - "5087:5010"
    environment:
      - SERVICE_NAME=doc_store
      - SERVICE_PORT=5010
      - DOCSTORE_PORT=5010
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DIR=/data/documents
      - LOG_LEVEL=INFO
    volumes:
      - doc-store-data:/data/documents
    depends_on:
      - redis
      - mcp-logs
    networks:
      - ams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5087/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ========================================
# Volumes
# ========================================

volumes:
  ollama-data:
    driver: local
  es-data:
    driver: local
  package-data:
    driver: local
  mcp-store-data:
    driver: local
  doc-store-data:
    driver: local

